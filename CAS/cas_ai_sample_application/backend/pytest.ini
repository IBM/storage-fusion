[pytest]
# Pytest configuration for IBM Fusion CAS Assistant backend

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths — unit tests live under testing/unit/
testpaths = testing/unit

# Python path configuration — makes `from agents.cas_agent import ...` resolve correctly
pythonpath = .

# Output options
addopts =
    --strict-markers
    --tb=short
    --no-header
    # Coverage disabled by default for faster runs.
    # Enable with: pytest --cov=. --cov-report=html --cov-report=term-missing --cov-branch

# Markers for test categorisation — mirrors the convention in cas_cli_chatbot/pytest.ini
markers =
    unit: Unit tests (no I/O, no network)
    integration: Integration tests (require a running CAS endpoint)
    slow: Tests that take more than a few seconds
    cas: CASAgent tests
    llm: LLMService tests
    chunk: ChunkProcessor tests
    validators: InputValidator tests
    session: SessionStore tests
    registry: ToolRegistry and multi-tool dispatch tests
    requires_network: Tests that make real outbound HTTP calls

# Coverage options
[coverage:run]
source = .
omit =
    */testing/*
    */venv/*
    */__pycache__/*
    */site-packages/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

# Suppress noisy third-party deprecation warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::pytest.PytestUnraisableExceptionWarning

# Silence the pytest-asyncio 0.24 "asyncio_default_fixture_loop_scope is unset"
# deprecation warning by explicitly setting the value it's asking for.
asyncio_default_fixture_loop_scope = function
