kind: ConfigMap
apiVersion: v1
metadata:
  name: gpu-fleet-acm-dashboard
  namespace: open-cluster-management-observability
  annotations:
    observability.open-cluster-management.io/dashboard-folder: Custom
  labels:
    grafana-custom-dashboard: "true"
data:
  gpu-fleet-acm-dashboard.json: |
    {
      "title": "GPU Fleet Overview — All Clusters",
      "uid": "gpu-fleet-acm-v1",
      "tags": ["GPU", "DCGM", "Fleet", "ACM"],
      "timezone": "browser",
      "schemaVersion": 38,
      "time": { "from": "now-3h", "to": "now" },
      "refresh": "30s",
      "templating": {
        "list": [
          {
            "name": "cluster",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "000000001" },
            "query": "label_values(DCGM_FI_DEV_GPU_TEMP, cluster)",
            "label": "Cluster",
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "hide": 0,
            "refresh": 2
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "── Fleet Health Summary",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "collapsed": false
        },
        {
          "id": 2,
          "title": "Total GPUs (Fleet)",
          "type": "stat",
          "datasource": { "type": "prometheus", "uid": "000000001" },
          "gridPos": { "h": 4, "w": 4, "x": 0, "y": 1 },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "graphMode": "none", "textMode": "auto" },
          "fieldConfig": { "defaults": { "color": { "fixedColor": "blue", "mode": "fixed" }, "thresholds": { "mode": "absolute", "steps": [{ "color": "blue", "value": 0 }] } } },
          "targets": [{ "datasource": { "type": "prometheus", "uid": "000000001" }, "expr": "count(DCGM_FI_DEV_GPU_TEMP{cluster=~\"$cluster\"})", "legendFormat": "" }]
        },
        {
          "id": 3,
          "title": "Fleet Avg GPU Health Score",
          "type": "gauge",
          "datasource": { "type": "prometheus", "uid": "000000001" },
          "gridPos": { "h": 4, "w": 4, "x": 4, "y": 1 },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "minVizWidth": 75, "minVizHeight": 75 },
          "fieldConfig": {
            "defaults": {
              "min": 0, "max": 100, "unit": "percent",
              "thresholds": { "mode": "absolute", "steps": [{ "color": "red", "value": 0 }, { "color": "yellow", "value": 60 }, { "color": "green", "value": 80 }] }
            }
          },
          "targets": [{ "datasource": { "type": "prometheus", "uid": "000000001" }, "expr": "avg(clamp_max(100 - clamp_max(avg by (cluster) (DCGM_FI_DEV_GPU_TEMP{cluster=~\"$cluster\"}) - 30, 70) - clamp_min(avg by (cluster) (DCGM_FI_DEV_ECC_DBE_VOL_TOTAL{cluster=~\"$cluster\"}), 0) * 10, 100))", "legendFormat": "" }]
        },
        {
          "id": 4,
          "title": "Avg GPU Utilisation %",
          "type": "stat",
          "datasource": { "type": "prometheus", "uid": "000000001" },
          "gridPos": { "h": 4, "w": 4, "x": 8, "y": 1 },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "graphMode": "area" },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": 0 }, { "color": "yellow", "value": 70 }, { "color": "red", "value": 90 }] }
            }
          },
          "targets": [{ "datasource": { "type": "prometheus", "uid": "000000001" }, "expr": "avg(DCGM_FI_DEV_GPU_UTIL{cluster=~\"$cluster\"})", "legendFormat": "" }]
        },
        {
          "id": 5,
          "title": "Avg GPU Temp (°C)",
          "type": "stat",
          "datasource": { "type": "prometheus", "uid": "000000001" },
          "gridPos": { "h": 4, "w": 4, "x": 12, "y": 1 },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "graphMode": "none" },
          "fieldConfig": {
            "defaults": {
              "unit": "celsius",
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": 0 }, { "color": "yellow", "value": 75 }, { "color": "red", "value": 85 }] }
            }
          },
          "targets": [{ "datasource": { "type": "prometheus", "uid": "000000001" }, "expr": "avg(DCGM_FI_DEV_GPU_TEMP{cluster=~\"$cluster\"})", "legendFormat": "" }]
        },
        {
          "id": 6,
          "title": "Avg Power Draw (W)",
          "type": "stat",
          "datasource": { "type": "prometheus", "uid": "000000001" },
          "gridPos": { "h": 4, "w": 4, "x": 16, "y": 1 },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "graphMode": "none" },
          "fieldConfig": { "defaults": { "unit": "watt", "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": 0 }] } } },
          "targets": [{ "datasource": { "type": "prometheus", "uid": "000000001" }, "expr": "avg(DCGM_FI_DEV_POWER_USAGE{cluster=~\"$cluster\"})", "legendFormat": "" }]
        },
        {
          "id": 7,
          "title": "Active DBE ECC Errors",
          "type": "stat",
          "datasource": { "type": "prometheus", "uid": "000000001" },
          "gridPos": { "h": 4, "w": 4, "x": 20, "y": 1 },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "graphMode": "none" },
          "fieldConfig": {
            "defaults": {
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": 0 }, { "color": "red", "value": 1 }] },
              "mappings": [{ "type": "value", "options": { "0": { "text": "0 — Clean", "color": "green" } } }]
            }
          },
          "targets": [{ "datasource": { "type": "prometheus", "uid": "000000001" }, "expr": "sum(DCGM_FI_DEV_ECC_DBE_VOL_TOTAL{cluster=~\"$cluster\"})", "legendFormat": "" }]
        },
        {
          "id": 10,
          "type": "row",
          "title": "── Per-Cluster GPU Utilisation & Health",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 5 },
          "collapsed": false
        },
        {
          "id": 11,
          "title": "GPU Utilisation % — All Clusters Over Time",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "000000001" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 6 },
          "fieldConfig": {
            "defaults": { "unit": "percent", "min": 0, "max": 100,
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": 0 }, { "color": "yellow", "value": 70 }, { "color": "red", "value": 90 }] }
            }
          },
          "options": { "tooltip": { "mode": "multi" }, "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "mean", "max"] } },
          "targets": [{ "datasource": { "type": "prometheus", "uid": "000000001" }, "expr": "avg by (cluster) (DCGM_FI_DEV_GPU_UTIL{cluster=~\"$cluster\"})", "legendFormat": "{{cluster}}" }]
        },
        {
          "id": 12,
          "title": "GPU Composite Health Score — All Clusters",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "000000001" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 6 },
          "fieldConfig": {
            "defaults": { "unit": "percent", "min": 0, "max": 100,
              "thresholds": { "mode": "absolute", "steps": [{ "color": "red", "value": 0 }, { "color": "yellow", "value": 60 }, { "color": "green", "value": 80 }] }
            }
          },
          "options": { "tooltip": { "mode": "multi" }, "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "min"] } },
          "targets": [{ "datasource": { "type": "prometheus", "uid": "000000001" }, "expr": "clamp_max(100 - clamp_max(avg by (cluster) (DCGM_FI_DEV_GPU_TEMP{cluster=~\"$cluster\"}) - 30, 70) - clamp_min(avg by (cluster) (DCGM_FI_DEV_ECC_DBE_VOL_TOTAL{cluster=~\"$cluster\"}), 0) * 10, 100)", "legendFormat": "{{cluster}}" }]
        },
        {
          "id": 20,
          "type": "row",
          "title": "── Framebuffer Memory (VRAM)",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 14 },
          "collapsed": false
        },
        {
          "id": 21,
          "title": "VRAM Used (GiB) — Per Cluster",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "000000001" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 15 },
          "fieldConfig": { "defaults": { "unit": "decgbytes" } },
          "options": { "tooltip": { "mode": "multi" }, "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"] } },
          "targets": [{ "datasource": { "type": "prometheus", "uid": "000000001" }, "expr": "sum by (cluster) (DCGM_FI_DEV_FB_USED{cluster=~\"$cluster\"}) / 1024", "legendFormat": "{{cluster}}" }]
        },
        {
          "id": 22,
          "title": "VRAM Utilisation % — Per Cluster",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "000000001" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 15 },
          "fieldConfig": {
            "defaults": { "unit": "percent", "min": 0, "max": 100,
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": 0 }, { "color": "yellow", "value": 70 }, { "color": "red", "value": 90 }] }
            }
          },
          "options": { "tooltip": { "mode": "multi" }, "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"] } },
          "targets": [{ "datasource": { "type": "prometheus", "uid": "000000001" }, "expr": "sum by (cluster) (DCGM_FI_DEV_FB_USED{cluster=~\"$cluster\"}) / sum by (cluster) (DCGM_FI_DEV_FB_TOTAL{cluster=~\"$cluster\"}) * 100", "legendFormat": "{{cluster}}" }]
        },
        {
          "id": 30,
          "type": "row",
          "title": "── Power & Thermal",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 23 },
          "collapsed": false
        },
        {
          "id": 31,
          "title": "Power Draw (W) — Per Cluster",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "000000001" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 24 },
          "fieldConfig": { "defaults": { "unit": "watt" } },
          "options": { "tooltip": { "mode": "multi" }, "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "mean", "max"] } },
          "targets": [{ "datasource": { "type": "prometheus", "uid": "000000001" }, "expr": "sum by (cluster) (DCGM_FI_DEV_POWER_USAGE{cluster=~\"$cluster\"})", "legendFormat": "{{cluster}}" }]
        },
        {
          "id": 32,
          "title": "GPU Temperature (°C) — Per Cluster",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "000000001" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 24 },
          "fieldConfig": {
            "defaults": { "unit": "celsius",
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": 0 }, { "color": "yellow", "value": 75 }, { "color": "red", "value": 85 }] }
            }
          },
          "options": { "tooltip": { "mode": "multi" }, "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"] } },
          "targets": [{ "datasource": { "type": "prometheus", "uid": "000000001" }, "expr": "max by (cluster) (DCGM_FI_DEV_GPU_TEMP{cluster=~\"$cluster\"})", "legendFormat": "{{cluster}}" }]
        },
        {
          "id": 40,
          "type": "row",
          "title": "── ECC Memory Health",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 32 },
          "collapsed": false
        },
        {
          "id": 41,
          "title": "ECC DBE Volatile Total — Per Cluster",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "000000001" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 33 },
          "fieldConfig": {
            "defaults": {
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": 0 }, { "color": "red", "value": 1 }] }
            }
          },
          "options": { "tooltip": { "mode": "multi" }, "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"] } },
          "targets": [{ "datasource": { "type": "prometheus", "uid": "000000001" }, "expr": "sum by (cluster) (DCGM_FI_DEV_ECC_DBE_VOL_TOTAL{cluster=~\"$cluster\"})", "legendFormat": "{{cluster}} DBE" }]
        },
        {
          "id": 42,
          "title": "ECC SBE Volatile Total — Per Cluster",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "000000001" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 33 },
          "fieldConfig": {
            "defaults": {
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": 0 }, { "color": "yellow", "value": 1 }, { "color": "red", "value": 10 }] }
            }
          },
          "options": { "tooltip": { "mode": "multi" }, "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"] } },
          "targets": [{ "datasource": { "type": "prometheus", "uid": "000000001" }, "expr": "sum by (cluster) (DCGM_FI_DEV_ECC_SBE_VOL_TOTAL{cluster=~\"$cluster\"})", "legendFormat": "{{cluster}} SBE" }]
        },
        {
          "id": 50,
          "type": "row",
          "title": "── GR Engine & Tensor Core Activity",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 41 },
          "collapsed": false
        },
        {
          "id": 51,
          "title": "GR Engine Active (0–1) — Per Cluster",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "000000001" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 42 },
          "fieldConfig": { "defaults": { "unit": "percentunit", "min": 0, "max": 1 } },
          "options": { "tooltip": { "mode": "multi" }, "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "mean"] } },
          "targets": [{ "datasource": { "type": "prometheus", "uid": "000000001" }, "expr": "avg by (cluster) (DCGM_FI_PROF_GR_ENGINE_ACTIVE{cluster=~\"$cluster\"})", "legendFormat": "{{cluster}}" }]
        },
        {
          "id": 52,
          "title": "Tensor Core Active (0–1) — Per Cluster",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "000000001" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 42 },
          "fieldConfig": { "defaults": { "unit": "percentunit", "min": 0, "max": 1 } },
          "options": { "tooltip": { "mode": "multi" }, "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "mean"] } },
          "targets": [{ "datasource": { "type": "prometheus", "uid": "000000001" }, "expr": "avg by (cluster) (DCGM_FI_PROF_PIPE_TENSOR_ACTIVE{cluster=~\"$cluster\"})", "legendFormat": "{{cluster}}" }]
        },
        {
          "id": 60,
          "type": "row",
          "title": "── Predictive Failure Risk",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 50 },
          "collapsed": false
        },
        {
          "id": 61,
          "title": "24h Failure Probability % — Per Cluster",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "000000001" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 51 },
          "fieldConfig": {
            "defaults": { "unit": "percent", "min": 0, "max": 100,
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": 0 }, { "color": "yellow", "value": 10 }, { "color": "red", "value": 30 }] }
            }
          },
          "options": { "tooltip": { "mode": "multi" }, "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"] } },
          "targets": [{ "datasource": { "type": "prometheus", "uid": "000000001" }, "expr": "clamp_max(clamp_min(clamp_min(avg by (cluster) (DCGM_FI_DEV_GPU_TEMP{cluster=~\"$cluster\"}) - 80, 0) * 2 + clamp_min(avg by (cluster) (increase(DCGM_FI_DEV_ECC_DBE_VOL_TOTAL{cluster=~\"$cluster\"}[24h])), 0) * 5 + clamp_min(avg by (cluster) (rate(DCGM_FI_DEV_PCIE_REPLAY_COUNTER{cluster=~\"$cluster\"}[1h])) * 3600, 0), 0), 100)", "legendFormat": "{{cluster}}" }]
        },
        {
          "id": 62,
          "title": "PCIe Replay Counter Rate — Per Cluster",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "000000001" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 51 },
          "fieldConfig": { "defaults": { "unit": "ops" } },
          "options": { "tooltip": { "mode": "multi" }, "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"] } },
          "targets": [{ "datasource": { "type": "prometheus", "uid": "000000001" }, "expr": "sum by (cluster) (rate(DCGM_FI_DEV_PCIE_REPLAY_COUNTER{cluster=~\"$cluster\"}[5m]))", "legendFormat": "{{cluster}}" }]
        }
      ]
    }
