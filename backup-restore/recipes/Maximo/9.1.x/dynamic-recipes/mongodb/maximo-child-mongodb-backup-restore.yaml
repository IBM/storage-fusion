apiVersion: spp-data-protection.isf.ibm.com/v1alpha1
kind: Recipe
metadata:
  labels:
    dp.isf.ibm.com/parent-recipe: maximo-parent-recipe
    dp.isf.ibm.com/parent-recipe-namespace: ibm-spectrum-fusion-ns
  name: maximo-mongodb-recipe
spec:
  appType: mongodb
  groups:
    - name: mongodb-volumes
      type: volume
      includedNamespaces:
        - ${MONGODB_NAMESPACE}
    - name: mongodb-crds
      type: resource
      includeClusterResources: true
      includedResourceTypes:
        - customresourcedefinitions
      labelSelector: mongodb-custom-label=manual
    - name: mongodb-resources
      type: resource
      includedNamespaces:
        - ${MONGODB_NAMESPACE}
      excludedResourceTypes:
        - pods
        - statefulsets
        - mongodbcommunity.mongodbcommunity.mongodb.com
        - grafanadashboards.integreatly.org
        - grafanadashboards.grafana.integreatly.org
    - name: mongodbcommunity
      type: resource
      includedNamespaces:
        - ${MONGODB_NAMESPACE}
      includedResourceTypes:
        - mongodbcommunity.mongodbcommunity.mongodb.com
  hooks:
  - name: mongodb-operator-check
    type: check
    namespace: ${MONGODB_NAMESPACE}
    selectResource: deployment
    labelSelector: owner=mongodb
    timeout: 120
    onError: fail
    chks:
    - name: replicasReady
      timeout: 180
      onError: fail
      condition: "{$.spec.replicas} == {$.status.readyReplicas}"
  - name: mongodb-instance-check
    type: check
    namespace: ${MONGODB_NAMESPACE}
    selectResource: mongodbcommunity.mongodb.com/v1/mongodbcommunity
    nameSelector: mas-mongo-ce
    timeout: 120
    onError: fail
    chks:
    - name: phaseRunning
      timeout: 900
      onError: fail
      condition: "{$.status.phase} == {\"Running\"}"
  - name: mongodb-pod-exec
    labelSelector: app=mas-mongo-ce-svc
    timeout: 600
    namespace: ${MONGODB_NAMESPACE}
    onError: fail
    ops:
      - command: >
          ["/bin/bash", "-c", "PASSWORD=$(curl -H \"Authorization: Bearer `cat /var/run/secrets/kubernetes.io/serviceaccount/token`\" -k https://kubernetes.default.svc/api/v1/namespaces/${MONGODB_NAMESPACE}/secrets/mas-mongo-ce-admin-admin | python3 -c \"import sys, json; data = json.load(sys.stdin); print(data['data']['password'])\" | base64 -d); [[ $(mongosh --host localhost -u admin -p $PASSWORD --port 27017 --tls --tlsAllowInvalidCertificates --eval \"rs.isMaster().ismaster\" --quiet | tail -1) == \"true\" ]] && mongosh --host localhost -u admin -p $PASSWORD --port 27017 --tls --tlsAllowInvalidCertificates --eval \"db.fsyncLock()\" || echo \"Not Master\""]
        container: mongod
        timeout: 300
        name: fsyncLock
        onError: fail
      - command: >
          ["/bin/bash", "-c", "PASSWORD=$(curl -H \"Authorization: Bearer `cat /var/run/secrets/kubernetes.io/serviceaccount/token`\" -k https://kubernetes.default.svc/api/v1/namespaces/${MONGODB_NAMESPACE}/secrets/mas-mongo-ce-admin-admin | python3 -c \"import sys, json; data = json.load(sys.stdin); print(data['data']['password'])\" | base64 -d); [[ $(mongosh --host localhost -u admin -p $PASSWORD --port 27017 --tls --tlsAllowInvalidCertificates --eval \"rs.isMaster().ismaster\" --quiet | tail -1) == \"true\" ]] && mongosh --host localhost -u admin -p $PASSWORD --port 27017 --tls --tlsAllowInvalidCertificates --eval \"db.fsyncUnlock()\" || echo \"Not Master\""]
        container: mongod
        timeout: 300
        name: fsyncUnlock
        onError: fail
      - command: >
          ["/bin/bash", "-c", "export DB=mas_${MAS_INSTANCE_ID}_core; export PASSWORD=$(curl -H \"Authorization: Bearer `cat /var/run/secrets/kubernetes.io/serviceaccount/token`\" -k https://kubernetes.default.svc/api/v1/namespaces/${MONGODB_NAMESPACE}/secrets/mas-mongo-ce-admin-admin | python3 -c \"import sys, json; data = json.load(sys.stdin); print(data['data']['password'])\" | base64 -d); [[ $(mongosh --host localhost -u admin -p $PASSWORD --port 27017 --tls --tlsAllowInvalidCertificates --eval \"rs.isMaster().ismaster\" --quiet | tail -1) == \"true\" ]] && mongosh --host localhost -u admin -p $PASSWORD --port 27017 --tls --tlsAllowInvalidCertificates  --eval \"db = connect('mongodb://localhost/admin?tls=true&tlsAllowInvalidCertificates=true'); db.auth('admin', process.env.PASSWORD); mydb = db.getSiblingDB(process.env.DB); printjson(mydb.OauthClient.drop());\" || echo \"Not Master\""]
        container: mongod
        timeout: 300
        name: dropCollection
        onError: fail
      #IfMVIUncomment- command: >
          #IfMVIUncomment["/bin/bash", "-c", "export DB=mas-${MAS_INSTANCE_ID}-visualinspection; export PASSWORD=$(curl -H \"Authorization: Bearer `cat /var/run/secrets/kubernetes.io/serviceaccount/token`\" -k https://kubernetes.default.svc/api/v1/namespaces/${MONGODB_NAMESPACE}/secrets/mas-mongo-ce-admin-admin | python3 -c \"import sys, json; data = json.load(sys.stdin); print(data['data']['password'])\" | base64 -d); [[ $(mongosh --host localhost -u admin -p $PASSWORD --port 27017 --tls --tlsAllowInvalidCertificates --eval \"rs.isMaster().ismaster\" --quiet | tail -1) == \"true\" ]] && mongosh --host localhost -u admin -p $PASSWORD --port 27017 --tls --tlsAllowInvalidCertificates  --eval \"db = connect('mongodb://localhost/admin?tls=true&tlsAllowInvalidCertificates=true'); db.auth('admin', process.env.PASSWORD); mydb = db.getSiblingDB(process.env.DB); printjson(mydb.WebAPIs.drop());\" || echo \"Not Master\""]
        #IfMVIUncommentcontainer: mongod
        #IfMVIUncommenttimeout: 300
        #IfMVIUncommentname: dropCollectionMvi
        #IfMVIUncommentonError: fail
      #IfMVIUncomment- command: >
          #IfMVIUncomment["/bin/bash", "-c", "export DB=mas-${MAS_INSTANCE_ID}-visualinspection; export PASSWORD=$(curl -H \"Authorization: Bearer `cat /var/run/secrets/kubernetes.io/serviceaccount/token`\" -k https://kubernetes.default.svc/api/v1/namespaces/${MONGODB_NAMESPACE}/secrets/mas-mongo-ce-admin-admin | python3 -c \"import sys, json; data = json.load(sys.stdin); print(data['data']['password'])\" | base64 -d); [[ $(mongosh --host localhost -u admin -p $PASSWORD --port 27017 --tls --tlsAllowInvalidCertificates --eval \"rs.isMaster().ismaster\" --quiet | tail -1) == \"true\" ]] && mongosh --host localhost -u admin -p $PASSWORD --port 27017 --tls --tlsAllowInvalidCertificates  --eval \"db = connect('mongodb://localhost/admin?tls=true&tlsAllowInvalidCertificates=true'); db.auth('admin', process.env.PASSWORD); mydb = db.getSiblingDB(process.env.DB); printjson(mydb.TrainedModels.updateMany({ deployed: 1 },{ \\$set: { deployed: 0 } }));\" || echo \"Not Master\""]
        #IfMVIUncommentcontainer: mongod
        #IfMVIUncommenttimeout: 300
        #IfMVIUncommentname: undeployModelsMvi
        #IfMVIUncommentonError: fail
      #IfAssistUncomment- command: >
          #IfAssistUncomment["/bin/bash", "-c", "export DB=mas-assist; export PASSWORD=$(curl -H \"Authorization: Bearer `cat /var/run/secrets/kubernetes.io/serviceaccount/token`\" -k https://kubernetes.default.svc/api/v1/namespaces/${MONGODB_NAMESPACE}/secrets/mas-mongo-ce-admin-admin | python3 -c \"import sys, json; data = json.load(sys.stdin); print(data['data']['password'])\" | base64 -d); [[ $(mongosh --host localhost -u admin -p $PASSWORD --port 27017 --tls --tlsAllowInvalidCertificates --eval \"rs.isMaster().ismaster\" --quiet | tail -1) == \"true\" ]] && mongosh --host localhost -u admin -p $PASSWORD --port 27017 --tls --tlsAllowInvalidCertificates  --eval \"db = connect('mongodb://localhost/admin?tls=true&tlsAllowInvalidCertificates=true'); db.auth('admin', process.env.PASSWORD); mydb = db.getSiblingDB(process.env.DB); printjson(mydb.tenants.drop());\" || echo \"Not Master\""]
        #IfAssistUncommentcontainer: mongod
        #IfAssistUncommenttimeout: 300
        #IfAssistUncommentname: dropAssistTenants
        #IfAssistUncommentonError: fail
    selectResource: pod
    type: exec
  workflows:
  - name: maximo-backup-resources
    sequence:
    - group: mongodb-crds
    - group: mongodb-resources
    - group: mongodbcommunity
  - name: maximo-application-consistency-hooks
    sequence:
    - hook: mongodb-pod-exec/fsyncLock
  - name: maximo-volume-backup
    sequence:
    - group: mongodb-volumes
  - name: maximo-application-consistency-hook-undo
    sequence:
    - hook: mongodb-pod-exec/fsyncUnlock
  - name: maximo-restore-volumes
    priority: 0
    sequence:
    - group: mongodb-volumes
  - name: maximo-restore-database
    priority: 1
    sequence:
    - group: mongodb-crds
    - group: mongodb-resources
    - hook: mongodb-operator-check/replicasReady
    - group: mongodbcommunity
    - hook: mongodb-instance-check/phaseRunning
    - hook: mongodb-pod-exec/dropCollection
    #IfMVIUncomment- hook: mongodb-pod-exec/dropCollectionMvi
    #IfMVIUncomment- hook: mongodb-pod-exec/undeployModelsMvi
    #IfAssistUncomment- hook: mongodb-pod-exec/dropAssistTenants
