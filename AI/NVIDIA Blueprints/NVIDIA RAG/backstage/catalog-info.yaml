metadata:
  name: nvidia-rag-blueprint
  title: NVIDIA RAG Blueprint on IBM Fusion HCI
  description: |
    NVIDIA RAG (Retrieval-Augmented Generation) is a validated AI blueprint that grounds LLM responses in your own enterprise documents — eliminating hallucinations and ensuring every answer is traceable to a source. Deployed on IBM Fusion HCI using NVIDIA NIM microservices. This card covers v2 (latest); the original v1 deployment guide is also available on IBM Tech Exchange.

    How it works:
    - Ingests enterprise documents (PDFs, manuals, research papers) through OCR, table parsing, and layout extraction
    - Indexes content into a vector store (Elasticsearch via ECK Operator in v2) for fast semantic retrieval
    - At query time, retrieves the most relevant chunks, re-ranks them, and assembles an augmented prompt
    - LLM generates a grounded answer with citations — responses are fully traceable to source documents

    What makes it production-ready:
    - Multi-modal document intelligence — handles tables, charts, scanned PDFs, and complex layouts
    - Bring-your-own model endpoints — connect your own LLM, embedding, and reranking services
    - IBM-mirrored container images (icr.io/cp/fsh) — air-gap ready, no NVIDIA NGC pull required
    - Built-in telemetry and evaluation tooling for operational observability

    Why IBM Fusion HCI:
    - Converged compute and storage — GPU nodes and NVMe storage on the same platform
    - Predictable GPU scheduling via Red Hat OpenShift with the NVIDIA GPU Operator
    - Unified environment where multiple AI blueprints (RAG, AI-Q, VSS) coexist on one cluster
    - Deployed directly from the OpenShift Software Catalog — no Helm CLI or NGC credentials needed
