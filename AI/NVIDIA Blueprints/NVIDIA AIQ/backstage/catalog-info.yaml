metadata:
  name: nvidia-aiq-blueprint
  title: NVIDIA AI-Q Blueprint on IBM Fusion HCI
  description: |
    NVIDIA AI-Q is a validated AI blueprint that turns your document collections into a searchable, AI-queryable knowledge base — deployed on IBM Fusion HCI using NVIDIA NIM microservices. This card covers v2 (latest); the original v1 deployment guide is also available on IBM Tech Exchange.

    How it works:
    - Ingests PDFs, spreadsheets, and complex documents through OCR and layout parsing
    - Indexes content into a GPU-accelerated vector store for fast semantic retrieval
    - At query time, retrieves the most relevant document chunks and runs multi-hop reasoning
    - Returns precise answers with source citations — fully traceable, no hallucination

    What makes it different from a chatbot:
    - Full multi-stage AI workflow, not a single LLM call
    - Answers are grounded with citations from your actual documents
    - Handles complex enterprise content — tables, charts, scanned PDFs
    - Optionally enriches answers with live web search via Tavily
    - Ideal for policy Q&A, technical documentation search, and knowledge management

    Why IBM Fusion HCI:
    - Converged compute and storage — GPU nodes and NVMe storage on the same platform
    - Predictable GPU scheduling via Red Hat OpenShift with the NVIDIA GPU Operator
    - IBM-mirrored container images (icr.io/cp/fsh/) — air-gap ready, no NVIDIA NGC pull required
    - Unified environment where multiple AI blueprints (RAG, AI-Q, VSS) coexist on one cluster
    - Fully automated deployment via OpenShift Software Catalog or Helm — no manual YAML editing
