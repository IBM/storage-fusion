{{- $dbESOEnabled  := and .Values.modelRegistry.enabled .Values.modelRegistry.database.external .Values.modelRegistry.database.externalSecret.enabled }}
{{- $osESOEnabled  := and .Values.modelRegistry.enabled .Values.modelRegistry.objectStorage.enabled (not .Values.modelRegistry.objectStorage.autoCreateBucket) .Values.modelRegistry.objectStorage.externalSecret.enabled }}
{{- $anyESOEnabled := or $dbESOEnabled $osESOEnabled }}
{{- if $anyESOEnabled }}
---
# ─────────────────────────────────────────────────────────────────────────────
# ArgoCD application-controller RBAC for ExternalSecret resources.
#
# Problem: ArgoCD's application-controller ServiceAccount runs in
# openshift-gitops. By default it has no permissions on the
# external-secrets.io API group in other namespaces. When the maas-runtime
# Application tries to sync an ExternalSecret into modelRegistry.namespace,
# the API server rejects it with:
#   "cannot patch resource externalsecrets in API group external-secrets.io
#    in the namespace rhoai-model-registries"
#
# Fix: grant the ArgoCD application-controller SA the minimum verbs it needs
# to manage ExternalSecret resources — scoped to modelRegistry.namespace only.
#
# This template renders when either (or both) ESO flags are true:
#   modelRegistry.database.externalSecret.enabled: true   (DB credentials)
#   modelRegistry.objectStorage.externalSecret.enabled: true  (object storage)
#
# It is removed automatically when both flags are false, keeping RBAC tightly
# scoped to intent — no standing permissions when ESO is not in use.
#
# ClusterRole name: argocd-externalsecret-manager-model-registry
#   Intentionally distinct from maas-platform's argocd-externalsecret-manager
#   so both charts can coexist on the same cluster without name collision.
#
# Least-privilege design: ClusterRole + namespaced RoleBinding (not
# ClusterRoleBinding) confines the grant to modelRegistry.namespace only.
#
# Ref: https://argo-cd.readthedocs.io/en/stable/operator-manual/security/
# ─────────────────────────────────────────────────────────────────────────────

# ClusterRole — defines verbs on ExternalSecret resources (cluster-scoped
# definition, namespace-scoped enforcement via RoleBinding below).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argocd-externalsecret-manager-model-registry
  annotations:
    # Wave 0 — must exist before ArgoCD attempts to create the ExternalSecret
    # CRs in wave 1. If this RoleBinding is missing at sync time ArgoCD will
    # reject the ExternalSecret with a forbidden error on the very first apply.
    argocd.argoproj.io/sync-wave: "0"
  labels:
    {{- include "maas-runtime.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - external-secrets.io
    resources:
      - externalsecrets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
---
# RoleBinding — binds the ClusterRole inside modelRegistry.namespace only.
# The ArgoCD application-controller ServiceAccount name follows the pattern:
#   openshift-gitops-argocd-application-controller
# in the openshift-gitops namespace (Red Hat OpenShift GitOps default).
#
# Active ExternalSecrets covered by this binding:
{{- if $dbESOEnabled }}
#   - model-registry-db-credentials  (database.externalSecret.enabled: true)
{{- end }}
{{- if $osESOEnabled }}
#   - model-registry-object-storage  (objectStorage.externalSecret.enabled: true)
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-externalsecret-manager-model-registry
  namespace: {{ .Values.modelRegistry.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    {{- include "maas-runtime.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argocd-externalsecret-manager-model-registry
subjects:
  - kind: ServiceAccount
    name: openshift-gitops-argocd-application-controller
    namespace: openshift-gitops
{{- end }}
