{{- if .Values.s3.externalSecret.enabled }}
{{- $eso      := .Values.s3.externalSecret }}
{{- $connName := include "maas-model-deploy.connectionSecretName" . }}
---
# storage-config ExternalSecret
# ESO assembles the KServe storage-initializer JSON from Vault fields.
# Produces the same "storage-config" Secret shape as the manual-mode template.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: storage-config
  namespace: {{ include "maas-model-deploy.namespace" . }}
  labels:
    {{- include "maas-model-deploy.labels" . | nindent 4 }}
    opendatahub.io/managed: "true"
    app.kubernetes.io/component: storage-config
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    helm.sh/resource-policy: keep
    {{- include "maas-model-deploy.annotations" . | nindent 4 }}
spec:
  refreshInterval: {{ $eso.refreshInterval }}
  secretStoreRef:
    name: {{ $eso.secretStoreRef.name }}
    kind: {{ $eso.secretStoreRef.kind }}
  target:
    name: storage-config
    creationPolicy: Owner
    template:
      metadata:
        labels:
          opendatahub.io/managed: "true"
        annotations:
          helm.sh/resource-policy: keep
      type: Opaque
      data:
        {{ $connName }}: |
          {
            "type": "s3",
            "access_key_id":      "{{ `{{ .access_key_id }}` }}",
            "secret_access_key":  "{{ `{{ .secret_access_key }}` }}",
            "endpoint_url":       "{{ `{{ .endpoint }}` }}",
            "region":             "{{ `{{ .region }}` }}",
            "bucket":             "{{ `{{ .bucket }}` }}",
            "cabundle_configmap": "odh-kserve-custom-ca-bundle"
          }
  dataFrom:
    - extract:
        key: {{ $eso.remoteRef.key }}
{{- end }}
