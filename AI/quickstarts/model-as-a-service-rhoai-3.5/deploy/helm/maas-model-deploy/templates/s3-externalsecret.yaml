{{- if .Values.s3.externalSecret.enabled }}
{{- $eso  := .Values.s3.externalSecret }}
{{- $name := include "maas-model-deploy.connectionSecretName" . }}
---
# S3 Connection ExternalSecret
# All five S3 fields (access_key_id, secret_access_key, endpoint, region, bucket)
# are pulled from Vault. s3.endpoint / region / bucket in values.yaml are ignored
# in ESO mode. s3.modelPath and s3.verifySSL remain in values.yaml in both modes.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  namespace: {{ include "maas-model-deploy.namespace" . }}
  labels:
    {{- include "maas-model-deploy.labels" . | nindent 4 }}
    opendatahub.io/dashboard: "true"
    opendatahub.io/managed: "true"
    app.kubernetes.io/component: s3-connection
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    helm.sh/resource-policy: keep
    {{- include "maas-model-deploy.annotations" . | nindent 4 }}
spec:
  refreshInterval: {{ $eso.refreshInterval }}
  secretStoreRef:
    name: {{ $eso.secretStoreRef.name }}
    kind: {{ $eso.secretStoreRef.kind }}
  target:
    name: {{ $name }}
    creationPolicy: Owner
    # KServe reads s3-endpoint and s3-region from serving.kserve.io/* annotations
    # on the connection Secret. ESO's template engine stamps them from Vault fields.
    template:
      metadata:
        labels:
          opendatahub.io/dashboard: "true"
          opendatahub.io/managed: "true"
        annotations:
          helm.sh/resource-policy: keep
          opendatahub.io/connection-type: s3
          opendatahub.io/connection-type-protocol: s3
          opendatahub.io/connection-type-ref: s3
          openshift.io/display-name: {{ $name }}
          serving.kserve.io/s3-endpoint: "{{ `{{ .endpoint }}` }}"
          serving.kserve.io/s3-region: "{{ `{{ .region }}` }}"
          serving.kserve.io/s3-usehttps: "1"
          serving.kserve.io/s3-verifyssl: {{ .Values.s3.verifySSL | default "0" | quote }}
      type: Opaque
      data:
        AWS_ACCESS_KEY_ID: "{{ `{{ .access_key_id }}` }}"
        AWS_SECRET_ACCESS_KEY: "{{ `{{ .secret_access_key }}` }}"
        AWS_S3_ENDPOINT: "{{ `{{ .endpoint }}` }}"
        AWS_S3_BUCKET: "{{ `{{ .bucket }}` }}"
        AWS_DEFAULT_REGION: "{{ `{{ .region }}` }}"
  dataFrom:
    - extract:
        key: {{ $eso.remoteRef.key }}
{{- end }}
