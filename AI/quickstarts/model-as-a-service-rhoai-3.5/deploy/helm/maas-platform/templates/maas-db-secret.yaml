{{- if and .Values.maasDatabase.enabled .Values.maasDatabase.externalSecret.enabled (not .Values.maasDatabase.externalSecret.targetName) }}
  {{- fail "maasDatabase.enabled and maasDatabase.externalSecret.enabled are mutually exclusive when targetName is empty. Either set maasDatabase.enabled: false, or set externalSecret.targetName to a test name (e.g. maas-db-config-eso-test)." }}
{{- end }}
{{- if .Values.maasDatabase.enabled }}
---
# ─────────────────────────────────────────────────────────────────────────────
# maas-db-config Secret — consumed by maas-api at startup.
# Key: DB_CONNECTION_URL  (format: postgresql://user:pass@host:port/db?sslmode=X)
#
# Two modes controlled by maasDatabase.external:
#
#   external: false  — in-cluster PostgreSQL deployed by postgresql.yaml.
#                      Connection URL is assembled from maasDatabase.internal.*
#                      fields so you never have to hand-craft the URL.
#
#   external: true   — managed / pre-existing PostgreSQL (RDS, CloudSQL, Crunchy, …).
#                      Supply the full URL via maasDatabase.connectionUrl, OR
#                      provide individual fields via maasDatabase.externalDatabase.*
#                      and the URL is assembled for you.
#
# Ref: maas-setup.md §Database Setup; scripts/setup-database.sh
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: maas-db-config
  namespace: {{ .Values.maasDatabase.secretNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true,Prune=false
    helm.sh/resource-policy: keep
  labels:
    app: maas-api
    {{- include "maas-platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if not .Values.maasDatabase.external }}
  {{- /*
    Internal mode: assemble the URL from maasDatabase.internal.* so the user
    only has to fill in individual fields — no manual URL construction needed.
    FQDN: <service>.<namespace>.svc.cluster.local — mirrors setup-database.sh
    line 94 FQDN rewrite logic.
  */}}
  DB_CONNECTION_URL: {{ printf "postgresql://%s:%s@maas-postgres.%s.svc.cluster.local:5432/%s?sslmode=%s"
    .Values.maasDatabase.internal.username
    .Values.maasDatabase.internal.password
    .Values.maasDatabase.internal.namespace
    .Values.maasDatabase.internal.database
    .Values.maasDatabase.internal.sslMode | quote }}
  {{- else if .Values.maasDatabase.connectionUrl }}
  {{- /* External mode — user supplies the full pre-built connection URL */}}
  DB_CONNECTION_URL: {{ .Values.maasDatabase.connectionUrl | quote }}
  {{- else }}
  {{- /* External mode — assemble URL from individual externalDatabase fields */}}
  DB_CONNECTION_URL: {{ printf "postgresql://%s:%s@%s:%d/%s?sslmode=%s"
    .Values.maasDatabase.externalDatabase.username
    .Values.maasDatabase.externalDatabase.password
    .Values.maasDatabase.externalDatabase.host
    (.Values.maasDatabase.externalDatabase.port | int)
    .Values.maasDatabase.externalDatabase.database
    .Values.maasDatabase.externalDatabase.sslMode | quote }}
  {{- end }}
{{- end }}
