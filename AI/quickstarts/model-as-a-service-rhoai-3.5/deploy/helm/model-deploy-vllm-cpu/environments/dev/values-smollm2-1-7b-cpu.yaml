# =============================================================================
# Environment override – Development  |  Model: smollm2-1.7b-instruct (CPU)
# =============================================================================
# CPU vLLM dev environment — namespace: deploy-models-cpu-dev
# Override only keys that differ from base values.yaml defaults.
#
# Supply s3.accessKeyId and s3.secretAccessKey at deploy time via
# --set flags or sealed-secrets. Never commit real credentials here.
# =============================================================================

# -----------------------------------------------------------------------------
# Model Identification
# -----------------------------------------------------------------------------
model:
  # name: smollm2-1-7b-cpu        # set per-model in ArgoCD parameters
  namespace: deploy-models-cpu-dev

# -----------------------------------------------------------------------------
# Project / Namespace Configuration
# -----------------------------------------------------------------------------
project:
  create: true
  labels:
    environment: dev

# -----------------------------------------------------------------------------
# S3 Object Storage Configuration
# -----------------------------------------------------------------------------
s3:
  endpoint: "https://s3.openshift-storage.svc:443"
  region: "us-east-1"
  bucket: ""          # override per model
  modelPath: ""       # override per model  e.g. "smollm2-1-7b-instruct-hf/1.0.0"
  accessKeyId: ""     # supply via --set or sealed-secret
  secretAccessKey: "" # supply via --set or sealed-secret
  verifySSL: "0"
  connectionSecretName: "deploy-models-cpu-connection"
  serviceAccountName: ""

# -----------------------------------------------------------------------------
# vLLM CPU ServingRuntime
# -----------------------------------------------------------------------------
servingRuntime:
  create: true   # false = reuse existing runtime in namespace; set name to that runtime's name
  # name: ""     # default: model.name. Set to share an existing runtime.
  image: "registry.redhat.io/rhaii-early-access/vllm-cpu-rhel9@sha256:139e070c2e4e2bc0254aa852b436c35ec2659e8424e228cc4c77a3bc2ddf50b6"
  # extraArgs intentionally empty — do NOT add --dtype=float32 or --max-model-len here.
  # See prod values for detailed explanation of why these args cause OOMKill.
  extraArgs: []
  # VLLM_CPU_KVCACHE_SPACE: container_limit - weights(bfloat16) - runtime_overhead
  # 16 GiB limit, SmolLM2-1.7B bfloat16 weights ~3.4 GiB, runtime ~2 GiB → safe headroom
  extraEnv:
    - name: VLLM_CPU_KVCACHE_SPACE
      value: "6"

# -----------------------------------------------------------------------------
# Inference Configuration
# -----------------------------------------------------------------------------
inference:
  replicas: 1

# -----------------------------------------------------------------------------
# External Access
# -----------------------------------------------------------------------------
externalAccess:
  enabled: true
  routeTimeoutSeconds: 300
  tokenSAName: "external-access-token"

# -----------------------------------------------------------------------------
# Resource Allocation — sized for small CPU-only models (≤2B params)
# -----------------------------------------------------------------------------
resources:
  limits:
    cpu: "8"
    memory: 16Gi
  requests:
    cpu: "4"
    memory: 8Gi

# -----------------------------------------------------------------------------
# Pod Scheduling — CPU nodes only, no GPU taints
# -----------------------------------------------------------------------------
scheduling:
  nodeSelector: {}
  tolerations: []
  affinity: {}

# -----------------------------------------------------------------------------
# Additional Labels
# -----------------------------------------------------------------------------
labels:
  environment: dev

annotations: {}
