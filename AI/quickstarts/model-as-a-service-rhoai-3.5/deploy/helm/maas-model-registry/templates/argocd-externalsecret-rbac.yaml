{{- $gcESOEnabled  := and .Values.buildConfig.gitCredentials.enabled .Values.buildConfig.gitCredentials.externalSecret.enabled }}
{{- $hfESOEnabled  := and .Values.huggingface.enabled .Values.huggingface.externalSecret.enabled }}
{{- $anyESOEnabled := or $gcESOEnabled $hfESOEnabled }}
{{- if $anyESOEnabled }}
---
# ─────────────────────────────────────────────────────────────────────────────
# ArgoCD application-controller RBAC for ExternalSecret resources.
#
# Problem: ArgoCD's application-controller ServiceAccount runs in
# openshift-gitops. By default it has no permissions on the
# external-secrets.io API group in other namespaces. When the
# maas-model-registry Application tries to sync an ExternalSecret, the API
# server rejects it with:
#   "cannot patch resource externalsecrets in API group external-secrets.io"
#
# Fix: grant the ArgoCD application-controller SA the minimum verbs it needs
# to manage ExternalSecret resources — scoped per namespace via RoleBindings.
#
# This template renders when either (or both) ESO flags are true:
#   buildConfig.gitCredentials.externalSecret.enabled: true  (git-credentials)
#   huggingface.externalSecret.enabled: true                 (huggingface-token)
#
# It is removed automatically when both flags are false, keeping RBAC tightly
# scoped to intent — no standing permissions when ESO is not in use.
#
# ClusterRole name: argocd-externalsecret-manager-model-registry-gitops
#   Intentionally distinct from maas-runtime's argocd-externalsecret-manager-model-registry
#   so both charts can coexist on the same cluster without name collision.
#
# Least-privilege design: one ClusterRole (cluster-scoped definition) bound by
# namespaced RoleBindings only — each RoleBinding confines the grant to the
# exact namespace where the ExternalSecret CR lives.
#
# Namespaces covered:
{{- if $gcESOEnabled }}
#   - {{ .Values.namespace }} (git-credentials ExternalSecret)
{{- end }}
{{- if $hfESOEnabled }}
#   - {{ .Values.modelRegistry.namespace }} (huggingface-token ExternalSecret)
{{- end }}
#
# Ref: https://argo-cd.readthedocs.io/en/stable/operator-manual/security/
# ─────────────────────────────────────────────────────────────────────────────

# ClusterRole — defines verbs on ExternalSecret resources (cluster-scoped
# definition, namespace-scoped enforcement via RoleBindings below).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argocd-externalsecret-manager-model-registry-gitops
  annotations:
    # Wave 0 — must exist before ArgoCD attempts to create the ExternalSecret
    # CRs in wave 1. If this ClusterRole/RoleBinding is missing at sync time
    # ArgoCD will reject the ExternalSecret with a forbidden error.
    argocd.argoproj.io/sync-wave: "0"
  labels:
    {{- include "model-registry-gitops.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - external-secrets.io
    resources:
      - externalsecrets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
{{- if $gcESOEnabled }}
---
# RoleBinding — binds the ClusterRole inside .Values.namespace only.
# Covers: git-credentials ExternalSecret
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-externalsecret-manager-model-registry-gitops
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    {{- include "model-registry-gitops.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argocd-externalsecret-manager-model-registry-gitops
subjects:
  - kind: ServiceAccount
    name: {{ .Values.argocd.serviceAccountName }}
    namespace: {{ .Values.argocd.namespace }}
{{- end }}
{{- if $hfESOEnabled }}
---
# RoleBinding — binds the ClusterRole inside modelRegistry.namespace only.
# Covers: huggingface-token ExternalSecret
# Note: huggingface-token is created in modelRegistry.namespace because the
# reconciler reads it from there (self.target_namespace in reconciler.py).
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-externalsecret-manager-model-registry-gitops-hf
  namespace: {{ .Values.modelRegistry.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    {{- include "model-registry-gitops.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argocd-externalsecret-manager-model-registry-gitops
subjects:
  - kind: ServiceAccount
    name: {{ .Values.argocd.serviceAccountName }}
    namespace: {{ .Values.argocd.namespace }}
{{- end }}
{{- end }}
