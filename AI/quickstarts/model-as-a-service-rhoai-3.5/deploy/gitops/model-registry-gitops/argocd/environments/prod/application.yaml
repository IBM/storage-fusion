apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fusion-model-registry-gitops-prod
  namespace: openshift-gitops
  labels:
    app: fusion-model-registry-gitops
    environment: prod
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: fusion-model-registry-gitops-prod
  
  source:
    repoURL: https://github.com/IBM/storage-fusion.git
    targetRevision: master
    path: AI/quickstarts/model-as-a-service-rhoai-3.5/deploy/helm/maas-model-registry
    
    helm:
      valueFiles:
        - values.yaml
        - environments/prod/values.yaml
  
  destination:
    server: https://kubernetes.default.svc
    namespace: fusion-model-registry-gitops-prod
  
  syncPolicy:
    # Manual sync for production
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
      - PrunePropagationPolicy=background  # background avoids blocking sync on cascading deletes
      - PruneLast=true
    
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  
  ignoreDifferences:
    - group: build.openshift.io
      kind: BuildConfig
      jsonPointers:
        - /status
        # Ignore the ConfigChange trigger lastTriggeredImageID to prevent ArgoCD
        # re-applying the BuildConfig on every sync and re-firing the build trigger.
        - /spec/triggers
    - group: image.openshift.io
      kind: ImageStream
      jsonPointers:
        - /status
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
