      # IBM Granite 3.1 8B Instruct

      Enterprise instruction-tuned LLM optimized for code generation and enterprise assistant tasks.
      - **Parameters**: 8 Billion
      - **Inference Runtime**: vLLM (Tensor Parallelism = 1)
      - **License**: Apache 2.0
    provider: "IBM"
    license: "apache-2.0"
    licenseLink: "https://www.apache.org/licenses/LICENSE-2.0.txt"
    artifacts:
      - uri: "s3://models/granite-3.1-8b/"

  - name: "gpt-oss-20b"
