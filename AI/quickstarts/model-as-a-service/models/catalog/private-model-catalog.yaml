      # GPT-OSS 20B

      General purpose open model hosted completely offline.
      - **Parameters**: 20 Billion
      - **Inference Runtime**: vLLM (Tensor Parallelism = 1)
      - **License**: Apache 2.0
    provider: "Enterprise AI Platform"
    license: "apache-2.0"
