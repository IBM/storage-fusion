# =============================================================================
# MaaS Model Service Configuration
# =============================================================================
# This Helm chart supports the following deployment modes:
# 1. LLM-D Distributed Inference - Uses LLMInferenceService
#
# =============================================================================

# -----------------------------------------------------------------------------
# Model Identification
# -----------------------------------------------------------------------------
model:
  # Unique name for the model (used in URLs and resource names)
  name: my-model
  
  # Display name shown in dashboards and UIs
  displayName: "My Model Display Name"
  
  # Namespace where the model will be deployed
  # Should match the modelsNamespace from maas-runtime
  namespace: maas-models

# -----------------------------------------------------------------------------
# Project/Namespace Configuration
# -----------------------------------------------------------------------------
project:
  # Create the namespace/project if it doesn't exist
  # Set to false if the namespace already exists
  create: true
  
  # Additional labels for the namespace
  # The opendatahub.io/dashboard: "true" label is automatically added
  # to make the project visible in OpenShift AI UI
  labels: {}
    # team: ai-platform
    # environment: production
  
  # Additional annotations for the namespace
  annotations: {}
    # description: "Model deployment namespace"

# -----------------------------------------------------------------------------
# Model Registry Configuration
# -----------------------------------------------------------------------------
# Use this to deploy models from the model registry
modelRegistry:
  # Enable model registry deployment mode
  enabled: false
  
  # Model registry name
  name: "model-registry"
  
  # Model registry namespace
  namespace: "rhoai-model-registries"
  
  # Registered model name (from model registry)
  registeredModelName: ""
  
  # Model version (optional, defaults to latest)
  modelVersion: ""
  
  # Model version ID (alternative to modelVersion)
  modelVersionId: ""
  
  # Registered model ID (optional)
  registeredModelId: ""
  
  # Connection secret for pulling model images
  # This should contain registry credentials if needed
  connectionSecret: ""
  
  # Create connection secret if it doesn't exist
  createConnectionSecret: false
  
  # Connection secret data (only used if createConnectionSecret is true)
  connectionSecretData:
    # OCI registry host (e.g., registry.redhat.io, quay.io, or your internal registry mirror)
    ociHost: ""
    # Access type (default: '["Pull"]')
    accessType: '["Pull"]'

# -----------------------------------------------------------------------------
# Model Source Configuration
# -----------------------------------------------------------------------------
# Used when modelRegistry.enabled is false.
# Supported URI schemes:
#
#   pvc://pvc-name/          — RECOMMENDED for large models (>50GB).
#                              KServe mounts the PVC directly — no copy on
#                              pod restart. Pre-populate the PVC once using
#                              the NooBaa S3 populate job (see README B.2).
#                              Requires pvc.enabled: true below.
#
#   s3://bucket/prefix       — Fine for small models (<20GB). KServe copies
#                              weights from S3 into emptyDir on every pod
#                              start. Requires s3.enabled: true below.
#
#   oci://registry/image:tag — OCI ModelCar image (weights as container layers).
#
source:
  uri: ""

# -----------------------------------------------------------------------------
# PVC Data Connection (recommended for large models >50GB)
# -----------------------------------------------------------------------------
# Set enabled: true when source.uri is pvc://...
#
# The chart creates the PVC automatically when create: true.
# Set create: false when the PVC already exists (e.g. pre-populated by the
# NooBaa S3 download job) so Helm does not adopt or delete it.
#
# KServe wiring: a ServiceAccount named <model>-sa is created automatically
# when pvc.enabled or s3.enabled is true — no manual oc create sa needed.
pvc:
  enabled: false

  # Create the PVC as part of this Helm release.
  # Set false when the PVC was pre-created by the NooBaa populate job.
  create: false

  # Name of the PVC containing model weights (must match source.uri pvc://<name>/)
  claimName: ""

  # Storage size — required when create: true (e.g. "450Gi")
  size: ""

  # StorageClass:
  #   ocs-storagecluster-cephfs    — ReadWriteMany, multi-node (recommended for TP>1)
  #   ocs-storagecluster-ceph-rbd  — ReadWriteOnce, single-node (lower latency)
  storageClass: "ocs-storagecluster-cephfs"

  # Use ReadWriteMany access mode (required for tensor-parallel across nodes)
  # Set false only for single-node RWO (ceph-rbd) deployments
  readWriteMany: true

# -----------------------------------------------------------------------------
# Optional S3 Data Connection (suitable for small models <20GB)
# -----------------------------------------------------------------------------
# Set enabled: true when source.uri is s3://...
# For large models prefer pvc: above — S3 re-copies weights on every pod start.
#
# createSecret: true  — Helm creates the KServe S3 secret automatically.
#                       Supply accessKeyId / secretAccessKey at deploy time via
#                       --set s3.accessKeyId=... --set s3.secretAccessKey=...
#                       DO NOT commit credentials to source control.
# createSecret: false — Secret already exists (created out-of-band).
#                       Set secretName to match the existing secret name.
s3:
  enabled: false

  # Create the KServe S3 credentials secret as part of this Helm release.
  createSecret: false

  # Name of the existing secret (used when createSecret: false)
  secretName: "aws-connection-models"

  # S3 endpoint without scheme — e.g. s3.openshift-storage.svc:443
  endpoint: ""
  region: "us-east-1"
  bucket: ""

  # Credentials — only used when createSecret: true.
  # Pass via --set at deploy time; do not commit to values files.
  accessKeyId: ""
  secretAccessKey: ""

# -----------------------------------------------------------------------------
# Accelerator Configuration
# -----------------------------------------------------------------------------
# Declare exactly ONE GPU vendor per model deployment.
# The chart derives the correct resource key (nvidia.com/gpu or amd.com/gpu)
# from accelerator.vendor — do NOT place GPU keys under resources directly.
#
# vendor:         "nvidia" or "amd" — required, no default
# count:          number of GPUs per pod
# nodeSelector:   optional extra node selectors (GPU Operator labels work by default)
# tolerations:    GPU node tolerations (add if your GPU nodes have a NoSchedule taint)
# runtimeProfile: "vllm-cuda" for NVIDIA, "vllm-rocm" for AMD (informational)
# env:            hardware-specific container env (e.g. NCCL_P2P_DISABLE on PCIe-only
#                 boxes). Appended to inference.env. Normally set by a file in profiles/.
# args:           hardware-specific vLLM flags (e.g. --disable-custom-all-reduce).
#                 Appended to inference.args; applied ONLY when inference.command is set.
#
# Hardware-specific values belong in profiles/<name>.yaml, not in models/*.yaml:
#   ./scripts/deploy-model.sh --profile profiles/<name>.yaml models/<model>.yaml
accelerator:
  vendor: ""
  count: 1
  nodeSelector: {}
  tolerations: []
  runtimeProfile: ""
  env: []
  args: []

# -----------------------------------------------------------------------------
# RHOAI HardwareProfile reference (optional)
# -----------------------------------------------------------------------------
# When name is set the chart adds the annotations
#   opendatahub.io/hardware-profile-name / opendatahub.io/hardware-profile-namespace
# to the LLMInferenceService so RHOAI can inject scheduling from a HardwareProfile
# (oc get hardwareprofiles -A). Use EITHER this OR accelerator.nodeSelector/tolerations
# from a profiles/ file, not both. Confirm your RHOAI version honours the annotation on
# LLMInferenceService before relying on it (not covered by this repository).
hardwareProfile:
  name: ""
  namespace: redhat-ods-applications

# -----------------------------------------------------------------------------
# Inference Engine Configuration
# -----------------------------------------------------------------------------
# configuration for LLM-D mode
inference:
  # Inference engine to use
  # Supported: vllm, tgi (text-generation-inference), llama-cpp
  engine: vllm

  # Container image for the inference engine.
  # Required — must be supplied by the overlay. No default.
  # NVIDIA: registry.redhat.io/rhaiis/vllm-cuda-rhel9:3.3.0
  # AMD:    registry.redhat.io/rhaiis/vllm-rocm-rhel9:3.3.0  (confirm with Compute team)
  image: ""

  # Image pull policy
  imagePullPolicy: IfNotPresent

  # Number of replicas (for horizontal scaling)
  replicas: 1

  # ── Direct entrypoint override (recommended for RHOAI vLLM images) ────────
  #
  # The RHOAI-bundled vLLM image entrypoint (/opt/app-root/src/vllm_entrypoint.sh)
  # uses `eval` to expand VLLM_ADDITIONAL_ARGS. This STRIPS unescaped double-quotes,
  # breaking any arg that contains a JSON value (e.g. --default-chat-template-kwargs).
  # Symptom: "RuntimeError: Failed to infer device type" at startup (exit 1).
  #
  # Fix: bypass the RHOAI wrapper entirely by setting command + args here.
  # The container will execute directly: python3 -m vllm.entrypoints.openai.api_server
  #
  # When command is set:
  #   - args must include ALL vLLM flags explicitly (--port, --tensor-parallel-size, etc.)
  #   - Do NOT set extraArgs (VLLM_ADDITIONAL_ARGS) — it is ignored with direct entrypoint
  #   - spec.parallelism.tensor is still set by the IS controller from accelerator.count,
  #     but --tensor-parallel-size must ALSO be in args (no auto-injection with direct cmd)
  #
  # When command is empty (default):
  #   - RHOAI wrapper is used; args go via VLLM_ADDITIONAL_ARGS env var
  #   - Do NOT add --tensor-parallel-size or --port to extraArgs (injected by controller)
  #   - Avoid JSON values in extraArgs due to eval quoting issue
  #
  command: []
  # command:
  #   - python3
  #   - -m
  #   - vllm.entrypoints.openai.api_server

  # Explicit CLI args — used only when command is set (direct entrypoint mode).
  # When command is empty, use extraArgs (VLLM_ADDITIONAL_ARGS) instead.
  args: []
  # args:
  #   - --port=8000   # must be 8000: the workload Service, containerPort and operator probes use it
  #   - --model=/mnt/models
  #   - --served-model-name=my-model
  #   - --tensor-parallel-size=4

  # Optional startupProbe override for spec.template.containers[0].
  # The LLM-D operator default (60 x 10s = 10 min) kills large models mid-load.
  # Probe port must match --port (8000).
  # startupProbe: {}
  # startupProbe:
  #   httpGet: {path: /health, port: 8000, scheme: HTTP}
  #   periodSeconds: 10
  #   failureThreshold: 2147483647

  # Engine-specific arguments passed via VLLM_ADDITIONAL_ARGS env var.
  # Only effective when command is empty (RHOAI wrapper mode).
  # Do NOT add --tensor-parallel-size or --port here.
  extraArgs: []
    # - --enable-force-include-usage
    # - --enable-auto-tool-choice
    # - --tool-call-parser=qwen3_coder
    # - --trust-remote-code

  # Environment variables
  env: []
    # - name: HF_HOME
    #   value: /tmp/hf_home


# -----------------------------------------------------------------------------
# Resource Allocation
# -----------------------------------------------------------------------------
# GPU resource key is injected automatically from accelerator.vendor.
# Only set cpu and memory here.
resources:
  limits:
    cpu: "4"
    memory: 24Gi
  requests:
    cpu: "2"
    memory: 16Gi

# -----------------------------------------------------------------------------
# Pod Scheduling Configuration
# -----------------------------------------------------------------------------
# Use accelerator.nodeSelector and accelerator.tolerations for GPU placement.
# This scheduling block is for any additional non-GPU scheduling constraints.
scheduling:
  # Additional node selectors (merged with accelerator.nodeSelector)
  nodeSelector: {}

  # Additional tolerations (merged with accelerator.tolerations)
  tolerations: []

  # Affinity rules
  affinity: {}
    # podAntiAffinity:
    #   preferredDuringSchedulingIgnoredDuringExecution:
    #     - weight: 100
    #       podAffinityTerm:
    #         labelSelector:
    #           matchExpressions:
    #             - key: app
    #               operator: In
    #               values:
    #                 - model-service
    #         topologyKey: kubernetes.io/hostname

# -----------------------------------------------------------------------------
# Tier-based Access Control
# -----------------------------------------------------------------------------
# List of tiers that can access this model
# Must match tier names defined in maas-runtime
tiers:
  - free
  - premium
  - enterprise

# -----------------------------------------------------------------------------
# Rate Limiting Configuration
# -----------------------------------------------------------------------------
rateLimiting:
  # Enable rate limiting for this model
  enabled: false
  
  # Custom rate limits (overrides tier defaults)
  # Leave empty to use tier defaults from maas-runtime
  customLimits: {}

# Token-based rate limiting
tokenRateLimiting:
  # Enable token-based rate limiting
  enabled: false
  
  # Custom token limits (overrides tier defaults)
  customLimits: {}

# -----------------------------------------------------------------------------
# Gateway Configuration
# -----------------------------------------------------------------------------
# LLM-D creates a predictable in-cluster Service for every LLMInferenceService:
#   <model-name>-kserve-workload-svc.<namespace>.svc.cluster.local
#
# For single-tenant deployments where Bob (Bifrost) is the only consumer,
# set gateway.enabled: false — no Kuadrant, no Route, no extra hops.
# Bifrost talks directly to the LLM-D Service inside the cluster.
#
# Set gateway.enabled: true only when you need:
#   - Multi-tenant token enforcement (AuthPolicy / rate limiting)
#   - External exposure with per-model auth
#   - Kuadrant is installed on the cluster
gateway:
  # Enable Kuadrant gateway resources (Route, RateLimitPolicy).
  # false = single-tenant / Bifrost-direct mode (recommended default).
  # true  = multi-tenant mode — requires Kuadrant on the cluster.
  enabled: false

  # Gateway name (must match the gateway created by maas-runtime)
  name: "openshift-ai-inference"
  
  # Gateway namespace
  namespace: "openshift-ingress"
  
  # Expose the gateway externally via OpenShift Route.
  # Only takes effect when enabled: true.
  exposeExternally: false
  
  # OpenShift cluster wildcard domain — required when exposeExternally: true.
  # Set to: oc get ingresses.config/cluster -o jsonpath={.spec.domain}
  wildcardDomain: ""

# -----------------------------------------------------------------------------
# Monitoring Configuration
# -----------------------------------------------------------------------------
monitoring:
  # Enable monitoring for this model
  enabled: true
  
  # ServiceMonitor configuration
  serviceMonitor:
    enabled: true
    interval: 30s
    scrapeTimeout: 10s

# -----------------------------------------------------------------------------
# Additional Labels and Annotations
# -----------------------------------------------------------------------------
# Additional labels to apply to all resources
labels: {}
  # team: ai-platform
  # environment: production

# Additional annotations to apply to all resources
annotations: {}
  # managed-by: helm
