{{/*
  ServiceAccount — <model-name>-sa

  Required by RHOAI 3.5 LLMInferenceService reconciler: the controller expects
  a SA named <model>-sa in the model namespace before it will bind PVC/S3
  credentials. Without this SA the LLMInferenceService stays in Unknown/False
  indefinitely (timing bug in RHOAI 3.5).

  Created whenever pvc.enabled OR s3.enabled is true, regardless of
  modelRegistry mode (the SA is harmless when not needed).
*/}}
{{- if or .Values.pvc.enabled .Values.s3.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "maas-model-service.modelName" . }}-sa
  namespace: {{ include "maas-model-service.namespace" . }}
  labels:
    {{- include "maas-model-service.labels" . | nindent 4 }}
  annotations:
    {{- include "maas-model-service.annotations" . | nindent 4 }}
    # RHOAI 3.5 timing-bug workaround: SA must exist before the
    # LLMInferenceService reconciler runs or credentials will not bind.
    maas.redhat.com/purpose: kserve-storage-initializer
{{- if .Values.s3.enabled }}
secrets:
  - name: {{ include "maas-model-service.modelName" . }}-s3-connection
{{- end }}
{{- end }}
---
{{/*
  Default ServiceAccount patch — wire the model's storage secret into the
  namespace default SA so KServe's storage-initializer init-container can pull
  credentials from it without needing an explicit serviceAccountName on the pod.

  Only emitted when s3.enabled is true (PVC needs no credential secret).
*/}}
{{- if .Values.s3.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: {{ include "maas-model-service.namespace" . }}
secrets:
  - name: {{ include "maas-model-service.modelName" . }}-s3-connection
{{- end }}
