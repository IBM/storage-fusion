{{- if and .Values.modelRegistry.enabled .Values.modelRegistry.connectionSecret .Values.modelRegistry.createConnectionSecret }}
{{- $ociHost := "" }}
{{- if and .Values.modelRegistry.connectionSecretData .Values.modelRegistry.connectionSecretData.ociHost }}
  {{- $ociHost = .Values.modelRegistry.connectionSecretData.ociHost }}
{{- end }}
{{- if $ociHost }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.modelRegistry.connectionSecret }}
  namespace: {{ include "maas-model-service.namespace" . }}
  labels:
    {{- include "maas-model-service.labels" . | nindent 4 }}
    opendatahub.io/dashboard: "true"
  annotations:
    {{- include "maas-model-service.annotations" . | nindent 4 }}
    opendatahub.io/connection-type-protocol: oci
    opendatahub.io/connection-type-ref: oci-v1
    openshift.io/display-name: {{ .Values.modelRegistry.connectionSecret }}
type: Opaque
stringData:
  ACCESS_TYPE: {{ default "[\"Pull\"]" (and .Values.modelRegistry.connectionSecretData .Values.modelRegistry.connectionSecretData.accessType) | quote }}
  OCI_HOST: {{ $ociHost | quote }}
{{- end }}
{{- end }}
