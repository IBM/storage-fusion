{{/*
  S3 Data Connection Secret — KServe storage-initializer credentials

  Only rendered when s3.enabled is true AND s3.createSecret is true.
  The secret carries the serving.kserve.io/s3-* annotations that tell
  KServe's storage-initializer how to reach the S3 endpoint.

  Set s3.createSecret: false when the secret already exists (e.g. created
  out-of-band with credentials that must not appear in values files).
*/}}
{{- if and .Values.s3.enabled .Values.s3.createSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "maas-model-service.modelName" . }}-s3-connection
  namespace: {{ include "maas-model-service.namespace" . }}
  labels:
    {{- include "maas-model-service.labels" . | nindent 4 }}
  annotations:
    {{- include "maas-model-service.annotations" . | nindent 4 }}
    serving.kserve.io/s3-endpoint: {{ .Values.s3.endpoint | required "s3.endpoint is required when s3.createSecret: true" | quote }}
    serving.kserve.io/s3-region: {{ .Values.s3.region | default "us-east-1" | quote }}
    serving.kserve.io/s3-usehttps: "1"
    serving.kserve.io/s3-verifyssl: "0"
    serving.kserve.io/s3-useanoncredential: "false"
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: {{ .Values.s3.accessKeyId | required "s3.accessKeyId is required when s3.createSecret: true" | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.s3.secretAccessKey | required "s3.secretAccessKey is required when s3.createSecret: true" | quote }}
{{- end }}
