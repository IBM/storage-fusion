# =============================================================================
# MaaS Generic Model Specification — ibm-granite/granite-3.1-8b-instruct
# =============================================================================
# Architecture: IBM Granite 3.1 8B Instruct
# GPU Requirement: 1 GPU
# Use Cases: Enterprise Text, Summarization, Question Answering, Translation
# =============================================================================

accelerator:
  vendor: nvidia                  # 'nvidia' or 'amd'
  count: 1

model:
  name: granite-3-1-8b-version-1
  displayName: "IBM Granite 3.1 8B Instruct"
  namespace: deploy-models-rhoai

project:
  create: true

modelRegistry:
  enabled: true
  name: default-modelregistry
  namespace: rhoai-model-registries
  registeredModelName: "granite-3.1-8b-instruct"
  connectionSecret: "model-registry-connection"
  createConnectionSecret: true
  connectionSecretData:
    ociHost: "registry.redhat.io"

source:
  uri: ""                         # Auto-resolved from Model Registry

inference:
  engine: vllm
  image: registry.redhat.io/rhaiis/vllm-cuda-rhel9:3.3.0
  imagePullPolicy: IfNotPresent
  replicas: 1
  extraArgs:
    - --enable-force-include-usage
    - --max-model-len=8192
    - --gpu-memory-utilization=0.85
    - --trust-remote-code

# GPUs are added from accelerator.count; do not list nvidia.com/gpu here.
resources:
  limits:
    cpu: "8"
    memory: 24Gi
  requests:
    cpu: "4"
    memory: 12Gi

# Add nodeSelector / tolerations here or via a hardware profile (profiles/).
scheduling:
  nodeSelector: {}
  tolerations:
    - effect: NoSchedule
      key: nvidia.com/gpu
      operator: Exists
  affinity: {}

monitoring:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 30s
    scrapeTimeout: 10s

labels:
  app.kubernetes.io/name: granite-3-1-8b
  app.kubernetes.io/part-of: maas-platform
  tier: standard
