apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fusion-maas-governance-config-dev
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "300"
  labels:
    environment: dev
    component: maas-config
spec:
  project: fusion-maas-governance-config-dev

  source:
    repoURL: https://github.com/IBM/storage-fusion.git
    targetRevision: master
    path: AI/quickstarts/model-as-a-service-rhoai-3.5/deploy/helm/maas-config
    helm:
      valueFiles:
        - values.yaml
        - environments/dev/values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: models-as-a-service

  # Dev: fully automated — fast iteration, continuous deployment
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  ignoreDifferences:
    - group: maas.opendatahub.io
      kind: MaaSSubscription
      jsonPointers:
        - /status
    - group: maas.opendatahub.io
      kind: MaaSAuthPolicy
      jsonPointers:
        - /status
    - group: user.openshift.io
      kind: Group
      jsonPointers:
        - /status
        - /metadata/annotations/kubectl.kubernetes.io~1last-applied-configuration

  info:
    - name: Description
      value: MaaS Governance Config – Development Environment (MaaSSubscription + MaaSAuthPolicy)
    - name: Component
      value: MaaSSubscription, MaaSAuthPolicy, Group
    - name: Sync Wave
      value: "300"
    - name: Dependencies
      value: Requires fusion-maas-model-deploy-dev to be healthy (MaaSModelRef must exist)
    - name: Namespace
      value: models-as-a-service
