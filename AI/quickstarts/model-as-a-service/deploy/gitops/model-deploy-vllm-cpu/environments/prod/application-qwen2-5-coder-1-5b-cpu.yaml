apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fusion-vllm-cpu-model-deploy-prod-qwen2-5-coder-1-5b
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "200"
  labels:
    environment: prod
    component: model-deploy-cpu
    model: qwen2-5-coder-1-5b-cpu
spec:
  project: fusion-vllm-cpu-model-deploy-prod

  source:
    repoURL: https://github.com/IBM/storage-fusion.git
    targetRevision: master
    path: AI/quickstarts/model-as-a-service/deploy/helm/model-deploy-vllm-cpu
    helm:
      valueFiles:
        - values.yaml
        - environments/prod/values-qwen2-5-coder-1-5b-cpu.yaml
      parameters:
        - name: model.namespace
          value: deploy-models-cpu

  destination:
    server: https://kubernetes.default.svc
    namespace: deploy-models-cpu

  # Prod: manual sync ONLY, no prune — strict change management
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
      - PrunePropagationPolicy=foreground
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m

  ignoreDifferences:
    - group: serving.kserve.io
      kind: InferenceService
      jsonPointers:
        - /status
    - group: serving.kserve.io
      kind: ServingRuntime
      jsonPointers:
        - /status
    - group: ""
      kind: Secret
      jsonPointers:
        - /data/AWS_ACCESS_KEY_ID
        - /data/AWS_SECRET_ACCESS_KEY
    - group: ""
      kind: Secret
      name: storage-config
      jqPathExpressions:
        - .data
        - .metadata.labels
        - .metadata.annotations
    - group: ""
      kind: Namespace
      jqPathExpressions:
        - .metadata.labels["app.kubernetes.io/instance"]
        - .metadata.labels["model.name"]
    - group: ""
      kind: Secret
      jqPathExpressions:
        - .metadata.labels["app.kubernetes.io/instance"]
        - .metadata.labels["model.name"]
    - group: ""
      kind: ServiceAccount
      jqPathExpressions:
        - .metadata.labels["app.kubernetes.io/instance"]
        - .metadata.labels["model.name"]
    # ── Shared ExternalSecrets (deploy-models-cpu-connection, storage-config) ──
    # These CRs are shared across all model Applications. Their labels no longer
    # carry instance/model.name, but ArgoCD ServerSideApply still stamps a
    # tracking-id annotation referencing the owning release name. Suppress label
    # and annotation drift so non-owning Applications do not report OutOfSync.
    - group: external-secrets.io
      kind: ExternalSecret
      jqPathExpressions:
        - .metadata.labels["app.kubernetes.io/instance"]
        - .metadata.labels["model.name"]
        - .metadata.annotations["argocd.argoproj.io/tracking-id"]
    # ── argocd-manager-vllm-cpu ClusterRole + RoleBinding are shared ──────────
    # Created by whichever Application syncs first. Ignore ownership-label drift.
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
      name: argocd-manager-vllm-cpu
      jqPathExpressions:
        - .metadata.labels["app.kubernetes.io/instance"]
        - .metadata.labels["helm.sh/chart"]
        - .metadata.labels["model.name"]
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
      name: argocd-manager-vllm-cpu
      jqPathExpressions:
        - .metadata.labels["app.kubernetes.io/instance"]
        - .metadata.labels["helm.sh/chart"]
        - .metadata.labels["model.name"]

  info:
    - name: Description
      value: vLLM CPU Model Deploy – Production (qwen2.5-coder-1.5b-instruct)
    - name: Component
      value: ServingRuntime, InferenceService, S3 Connection Secret, ServiceAccount, Namespace
    - name: Runtime
      value: vLLM CPU (x86) — registry.redhat.io/rhoai/vllm-cpu-rhel9
    - name: Sync Wave
      value: "200"
    - name: Namespace
      value: deploy-models-cpu
    - name: Model
      value: qwen2-5-coder-1-5b-cpu
    - name: Note
      value: "CPU inference only — not published to MaaS catalogue."
