---
# ServiceAccount
# -----------------------------------------------------------------------
# The InferenceService predictor references this ServiceAccount so that
# the KServe storage-initialiser can read the S3 connection secret and
# pull the model artefacts at pod start-up time.
# -----------------------------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "model-deploy-vllm-cpu.serviceAccountName" . }}
  namespace: {{ include "model-deploy-vllm-cpu.namespace" . }}
  labels:
    {{- include "model-deploy-vllm-cpu.labels" . | nindent 4 }}
  annotations:
    # Shared resource – keep so a second model Application targeting the
    # same namespace does not recreate or delete it.
    helm.sh/resource-policy: keep
    {{- include "model-deploy-vllm-cpu.annotations" . | nindent 4 }}
secrets:
  - name: {{ include "model-deploy-vllm-cpu.connectionSecretName" . }}
