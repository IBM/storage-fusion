{{- if .Values.s3.externalSecret.enabled }}
{{- $eso  := .Values.s3.externalSecret }}
{{- $name := include "model-deploy-vllm-cpu.connectionSecretName" . }}
---
# S3 Connection ExternalSecret — ESO mode
# -----------------------------------------------------------------------
# All five S3 fields (access_key_id, secret_access_key, endpoint, region,
# bucket) are pulled from Vault by External Secrets Operator.
# s3.endpoint / region / bucket in values.yaml are ignored in ESO mode.
# s3.modelPath and s3.verifySSL remain effective in both modes.
# -----------------------------------------------------------------------
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  namespace: {{ include "model-deploy-vllm-cpu.namespace" . }}
  labels:
    # Stable labels only — no per-model instance/model.name labels.
    # This ExternalSecret is shared across all model Applications in the
    # namespace; model-scoped labels cause ArgoCD label-drift OutOfSync
    # on every Application that did not sync last.
    app.kubernetes.io/name: {{ include "model-deploy-vllm-cpu.name" . }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/component: s3-connection
    helm.sh/chart: {{ include "model-deploy-vllm-cpu.chart" . }}
    opendatahub.io/dashboard: "true"
    opendatahub.io/managed: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    helm.sh/resource-policy: keep
    {{- include "model-deploy-vllm-cpu.annotations" . | nindent 4 }}
spec:
  refreshInterval: {{ $eso.refreshInterval }}
  secretStoreRef:
    name: {{ $eso.secretStoreRef.name }}
    kind: {{ $eso.secretStoreRef.kind }}
  target:
    name: {{ $name }}
    creationPolicy: Owner
    template:
      metadata:
        labels:
          opendatahub.io/dashboard: "true"
          opendatahub.io/managed: "true"
        annotations:
          helm.sh/resource-policy: keep
          opendatahub.io/connection-type: s3
          opendatahub.io/connection-type-protocol: s3
          opendatahub.io/connection-type-ref: s3
          openshift.io/display-name: {{ $name }}
          serving.kserve.io/s3-endpoint: "{{ `{{ .endpoint }}` }}"
          serving.kserve.io/s3-region: "{{ `{{ .region }}` }}"
          serving.kserve.io/s3-usehttps: "1"
          serving.kserve.io/s3-verifyssl: {{ .Values.s3.verifySSL | default "0" | quote }}
      type: Opaque
      data:
        AWS_ACCESS_KEY_ID: "{{ `{{ .access_key_id }}` }}"
        AWS_SECRET_ACCESS_KEY: "{{ `{{ .secret_access_key }}` }}"
        AWS_S3_ENDPOINT: "{{ `{{ .endpoint }}` }}"
        AWS_S3_BUCKET: "{{ `{{ .bucket }}` }}"
        AWS_DEFAULT_REGION: "{{ `{{ .region }}` }}"
  # dataFrom.extract pulls all Vault keys directly into the ESO template
  # namespace. Vault key names must match the template variables exactly:
  #   access_key_id, secret_access_key, endpoint, bucket, region
  dataFrom:
    - extract:
        key: {{ $eso.remoteRef.key }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
{{- end }}
