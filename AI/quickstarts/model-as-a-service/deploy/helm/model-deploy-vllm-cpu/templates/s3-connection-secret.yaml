{{- if not .Values.s3.externalSecret.enabled }}
---
# S3 Connection Secret — Manual mode
# -----------------------------------------------------------------------
# Provides S3 credentials and endpoint information so that the
# InferenceService storage-initialiser can pull model artefacts.
#
# Annotated with OpenShift AI / KServe serving annotations so it is
# recognised as an S3 data connection in the RHOAI dashboard.
#
# Rendered only when s3.externalSecret.enabled is false (default).
# When ESO mode is on, templates/s3-externalsecret.yaml manages this
# secret via Vault instead.
#
# !!! IMPORTANT !!!
# Never commit real accessKeyId / secretAccessKey values here.
# Pass them at deploy time:
#   helm install ... --set s3.accessKeyId=<key> --set s3.secretAccessKey=<secret>
# Or switch to ESO mode: s3.externalSecret.enabled: true
# -----------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "model-deploy-vllm-cpu.connectionSecretName" . }}
  namespace: {{ include "model-deploy-vllm-cpu.namespace" . }}
  labels:
    {{- include "model-deploy-vllm-cpu.labels" . | nindent 4 }}
    opendatahub.io/dashboard: "true"
    opendatahub.io/managed: "true"
  annotations:
    # Shared resource — keep so a second model Application does not
    # recreate or delete the connection secret.
    helm.sh/resource-policy: keep
    {{- include "model-deploy-vllm-cpu.annotations" . | nindent 4 }}
    opendatahub.io/connection-type: s3
    opendatahub.io/connection-type-protocol: s3
    opendatahub.io/connection-type-ref: s3
    openshift.io/display-name: {{ include "model-deploy-vllm-cpu.connectionSecretName" . }}
    serving.kserve.io/s3-endpoint: {{ .Values.s3.endpoint | quote }}
    serving.kserve.io/s3-region: {{ .Values.s3.region | quote }}
    serving.kserve.io/s3-usehttps: "1"
    serving.kserve.io/s3-verifyssl: {{ .Values.s3.verifySSL | default "0" | quote }}
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: {{ .Values.s3.accessKeyId | required "s3.accessKeyId is required" | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.s3.secretAccessKey | required "s3.secretAccessKey is required" | quote }}
  AWS_S3_ENDPOINT: {{ .Values.s3.endpoint | quote }}
  AWS_S3_BUCKET: {{ .Values.s3.bucket | required "s3.bucket is required" | quote }}
  AWS_DEFAULT_REGION: {{ .Values.s3.region | quote }}
{{- end }}
