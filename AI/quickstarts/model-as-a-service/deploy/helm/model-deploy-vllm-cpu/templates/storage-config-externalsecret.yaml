{{- if .Values.s3.externalSecret.enabled }}
{{- $eso      := .Values.s3.externalSecret }}
{{- $connName := include "model-deploy-vllm-cpu.connectionSecretName" . }}
---
# storage-config ExternalSecret — ESO mode
# -----------------------------------------------------------------------
# ESO assembles the KServe storage-initialiser JSON from Vault fields.
# Produces the same "storage-config" Secret shape as the manual-mode
# template (storage-config.yaml) so the KServe init-container works
# identically regardless of which secret source is in use.
# -----------------------------------------------------------------------
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: storage-config
  namespace: {{ include "model-deploy-vllm-cpu.namespace" . }}
  labels:
    # Stable labels only — no per-model instance/model.name labels.
    # This ExternalSecret is shared across all model Applications in the
    # namespace; model-scoped labels cause ArgoCD label-drift OutOfSync
    # on every Application that did not sync last.
    app.kubernetes.io/name: {{ include "model-deploy-vllm-cpu.name" . }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/component: storage-config
    helm.sh/chart: {{ include "model-deploy-vllm-cpu.chart" . }}
    opendatahub.io/managed: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    helm.sh/resource-policy: keep
    {{- include "model-deploy-vllm-cpu.annotations" . | nindent 4 }}
spec:
  refreshInterval: {{ $eso.refreshInterval }}
  secretStoreRef:
    name: {{ $eso.secretStoreRef.name }}
    kind: {{ $eso.secretStoreRef.kind }}
  target:
    name: storage-config
    creationPolicy: Owner
    template:
      metadata:
        labels:
          opendatahub.io/managed: "true"
        annotations:
          helm.sh/resource-policy: keep
      type: Opaque
      data:
        {{ $connName }}: |
          {
            "type": "s3",
            "access_key_id":      "{{ `{{ .access_key_id }}` }}",
            "secret_access_key":  "{{ `{{ .secret_access_key }}` }}",
            "endpoint_url":       "{{ `{{ .endpoint }}` }}",
            "region":             "{{ `{{ .region }}` }}",
            "bucket":             "{{ `{{ .bucket }}` }}",
            "cabundle_configmap": "odh-kserve-custom-ca-bundle"
          }
  # dataFrom.extract pulls all Vault keys directly into the ESO template
  # namespace. Vault key names must match the template variables exactly:
  #   access_key_id, secret_access_key, endpoint, bucket, region
  dataFrom:
    - extract:
        key: {{ $eso.remoteRef.key }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
{{- end }}
