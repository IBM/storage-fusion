{{- if and .Values.buildConfig.gitCredentials.enabled .Values.buildConfig.gitCredentials.externalSecret.enabled }}
---
# ─────────────────────────────────────────────────────────────────────────────
# git-credentials ExternalSecret — managed by External Secrets Operator.
#
# ESO resolves this CR and writes the real Secret (git-credentials) into
# .Values.namespace. Two consumers already reference that Secret by name:
#   1. BuildConfig (sourceSecret)    — used during image builds to clone the
#      private Git repo.
#   2. model-sync CronJob (volume)   — git-sync container reads credentials
#      from /git-credentials/{username,token,password,ssh-privatekey}.
#
# Design:
#   All credential fields are fetched from Vault — there are no non-sensitive
#   fields to stamp from values. Populate whichever auth method you use:
#     username + token        → PAT / GitHub token auth (most common)
#     username + password     → basic auth
#     ssh-privatekey          → SSH key auth
#
# Vault command (token auth example):
#   vault kv put secret/maas/model-registry-gitops/git-credentials \
#     username="<git-user>" \
#     token="<personal-access-token>"
#
# Testing without touching the live secret:
#   buildConfig:
#     gitCredentials:
#       externalSecret:
#         enabled: true
#         targetName: git-credentials-eso-test   # ← safe test name
#
# Prerequisites:
#   1. External Secrets Operator installed (external-secrets-operator Helm chart).
#   2. A ClusterSecretStore (or SecretStore) named by externalSecret.secretStoreRef.name
#      exists and is Ready in the cluster.
#   3. Vault path pre-populated BEFORE the first ArgoCD sync (see above).
#   4. buildConfig.gitCredentials.enabled must be true.
# ─────────────────────────────────────────────────────────────────────────────
{{- $gc       := .Values.buildConfig.gitCredentials }}
{{- $eso      := $gc.externalSecret }}
{{- $targetName := $eso.targetName | default $gc.secretName }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $targetName }}
  namespace: {{ .Values.namespace }}
  annotations:
    # Wave 1 — ensure the Secret exists before the BuildConfig and CronJob
    # resources (which reference it by name) are applied.
    argocd.argoproj.io/sync-wave: "1"
    # Suppress ArgoCD dry-run failures when the ExternalSecret CRD is not yet installed.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    helm.sh/resource-policy: keep
  labels:
    app.kubernetes.io/component: git-credentials
    {{- include "model-registry-gitops.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $eso.refreshInterval }}
  secretStoreRef:
    name: {{ $eso.secretStoreRef.name }}
    kind: {{ $eso.secretStoreRef.kind }}
  target:
    name: {{ $targetName }}
    creationPolicy: Owner
  # Fetch credential fields from Vault.
  # username is required. The remaining fields are optional — set
  # errorPolicy: Ignore so ESO silently skips any field that is absent
  # in Vault rather than marking the ExternalSecret as failed.
  # Populate whichever auth method your Git host requires:
  #   token        → PAT / GitHub token auth
  #   password     → basic password auth
  #   ssh-privatekey → SSH key auth
  data:
    - secretKey: username
      remoteRef:
        key: {{ $eso.remoteRef.key }}
        property: username
    - secretKey: token
      remoteRef:
        key: {{ $eso.remoteRef.key }}
        property: token
      errorPolicy: Ignore
    - secretKey: password
      remoteRef:
        key: {{ $eso.remoteRef.key }}
        property: password
      errorPolicy: Ignore
    - secretKey: ssh-privatekey
      remoteRef:
        key: {{ $eso.remoteRef.key }}
        property: ssh-privatekey
      errorPolicy: Ignore
{{- end }}
