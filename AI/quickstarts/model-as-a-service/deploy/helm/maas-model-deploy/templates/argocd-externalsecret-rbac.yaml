{{- if .Values.s3.externalSecret.enabled }}
---
# ArgoCD RBAC — ExternalSecret resources
# Grants the ArgoCD application-controller permission to manage ExternalSecret CRs
# in the model namespace. Without this, ArgoCD sync fails with a "forbidden" error
# on the external-secrets.io API group.
# Wave 0: must be applied before the ExternalSecret CRs at wave 1.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argocd-externalsecret-manager-model-deploy
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    {{- include "maas-model-deploy.labels" . | nindent 4 }}
    app.kubernetes.io/component: argocd-eso-rbac
rules:
  - apiGroups:
      - external-secrets.io
    resources:
      - externalsecrets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  # Read status so ArgoCD can report ExternalSecret health correctly.
  - apiGroups:
      - external-secrets.io
    resources:
      - externalsecrets/status
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-externalsecret-manager-model-deploy
  namespace: {{ include "maas-model-deploy.namespace" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    {{- include "maas-model-deploy.labels" . | nindent 4 }}
    app.kubernetes.io/component: argocd-eso-rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argocd-externalsecret-manager-model-deploy
subjects:
  - kind: ServiceAccount
    name: {{ .Values.argocd.serviceAccountName }}
    namespace: {{ .Values.argocd.namespace }}
{{- end }}
