{{- if .Values.maasDatabase.externalSecret.enabled }}
---
# ─────────────────────────────────────────────────────────────────────────────
# ArgoCD application-controller RBAC for ExternalSecret resources.
#
# Problem: ArgoCD's application-controller ServiceAccount runs in
# openshift-gitops. By default it has no permissions on the
# external-secrets.io API group in other namespaces. When the maas-platform
# Application tries to sync an ExternalSecret into redhat-ods-applications,
# the API server rejects it with:
#   "cannot patch resource externalsecrets in API group external-secrets.io
#    in the namespace redhat-ods-applications"
#
# Fix: grant the ArgoCD application-controller SA the minimum verbs it needs
# to manage ExternalSecret resources — scoped to the secretNamespace only.
#
# This RoleBinding is created automatically when
#   maasDatabase.externalSecret.enabled: true
# and removed when that flag is false, keeping RBAC tightly scoped to intent.
#
# Ref: https://argo-cd.readthedocs.io/en/stable/operator-manual/security/
# ─────────────────────────────────────────────────────────────────────────────

# ClusterRole — grants verbs on ExternalSecret across any namespace.
# A ClusterRole + RoleBinding (not ClusterRoleBinding) confines the grant to
# the single secretNamespace, which is the least-privilege approach.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argocd-externalsecret-manager
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    {{- include "maas-platform.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - external-secrets.io
    resources:
      - externalsecrets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
---
# RoleBinding — binds the ClusterRole inside secretNamespace only.
# The ArgoCD application-controller SA name follows the pattern:
#   openshift-gitops-argocd-application-controller
# in the openshift-gitops namespace (Red Hat OpenShift GitOps default).
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-externalsecret-manager
  namespace: {{ .Values.maasDatabase.secretNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    {{- include "maas-platform.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argocd-externalsecret-manager
subjects:
  - kind: ServiceAccount
    name: openshift-gitops-argocd-application-controller
    namespace: openshift-gitops
{{- end }}
