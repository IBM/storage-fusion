{{- if .Values.maasDatabase.externalSecret.enabled }}
{{- $targetName := .Values.maasDatabase.externalSecret.targetName | default "maas-db-config" }}
---
# ─────────────────────────────────────────────────────────────────────────────
# maas-db-config ExternalSecret — managed by External Secrets Operator.
#
# ESO resolves this CR and writes the maas-db-config Secret into secretNamespace.
# maas-api reads DB_CONNECTION_URL from that Secret at startup.
#
# Two modes — controlled by maasDatabase.external:
#
#   external: true  (managed/external DB)
#     Vault stores the full pre-built connection URL as a single field.
#     ESO reads it verbatim → DB_CONNECTION_URL.
#     Vault path: maasDatabase.externalSecret.remoteRef.key
#     Vault field: maasDatabase.externalSecret.remoteRef.property
#
#   external: false  (in-cluster PostgreSQL — Option B, single source of truth)
#     Vault stores individual credentials at the SAME path as maas-postgres-creds.
#     ESO pulls username / password / database / sslMode and assembles the URL
#     via target.template — no second Vault path, no duplication.
#     Vault path: maasDatabase.internal.externalSecret.remoteRef.key
#     Vault fields: username, password, database, sslMode
#     Assembled URL: postgresql://<username>:<password>@maas-postgres
#                    .<internal.namespace>.svc.cluster.local:5432/<database>
#                    ?sslmode=<sslMode>
#
# Testing without touching the live secret:
#   maasDatabase.externalSecret.targetName: maas-db-config-eso-test
#
# Prerequisites:
#   1. External Secrets Operator installed (external-secrets-operator Helm chart).
#   2. ClusterSecretStore named by secretStoreRef.name exists and is Ready.
#   3. maasDatabase.enabled must be false — enforced by maas-db-secret.yaml.
#   4. Vault pre-populated BEFORE first ArgoCD sync.
#
# Ref: maas-setup.md §Database Setup; deploying-external-secrets-guide.md
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $targetName }}
  namespace: {{ .Values.maasDatabase.secretNamespace }}
  annotations:
    # Wave 1 — same wave as the Helm-managed Secret so maas-api sees it at the
    # same point in the sync order regardless of which path is chosen.
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    helm.sh/resource-policy: keep
  labels:
    app: maas-api
    {{- include "maas-platform.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.maasDatabase.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.maasDatabase.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.maasDatabase.externalSecret.secretStoreRef.kind }}
  target:
    name: {{ $targetName }}
    creationPolicy: Owner
    {{- if not .Values.maasDatabase.external }}
    # ── Option B: assemble DB_CONNECTION_URL from individual Vault fields ──────
    # ESO renders the Go template in .data below using the secretKey values
    # fetched from Vault. Helm braces are escaped using the "{{" / "}}" trick.
    template:
      type: Opaque
      data:
        DB_CONNECTION_URL: >-
          postgresql://
          {{- "{{" }} .username {{ "}}" -}}
          :
          {{- "{{" }} .password {{ "}}" -}}
          @maas-postgres.{{ .Values.maasDatabase.internal.namespace }}.svc.cluster.local:5432/
          {{- "{{" }} .database {{ "}}" -}}
          ?sslmode=
          {{- "{{" }} .sslMode {{ "}}" }}
    {{- end }}
  {{- if not .Values.maasDatabase.external }}
  # ── external: false — pull individual fields from the same Vault path ────────
  # Reuses maasDatabase.internal.externalSecret.remoteRef.key so there is a
  # single Vault path for all postgres credentials (username, password, database,
  # sslMode). Changing the password in Vault automatically updates both
  # maas-postgres-creds and maas-db-config on the next ESO refresh.
  data:
    - secretKey: username
      remoteRef:
        key: {{ .Values.maasDatabase.internal.externalSecret.remoteRef.key }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ .Values.maasDatabase.internal.externalSecret.remoteRef.key }}
        property: password
    - secretKey: database
      remoteRef:
        key: {{ .Values.maasDatabase.internal.externalSecret.remoteRef.key }}
        property: database
    - secretKey: sslMode
      remoteRef:
        key: {{ .Values.maasDatabase.internal.externalSecret.remoteRef.key }}
        property: sslMode
  {{- else }}
  # ── external: true — read the full pre-built connection URL from Vault ───────
  data:
    - secretKey: DB_CONNECTION_URL
      remoteRef:
        key: {{ .Values.maasDatabase.externalSecret.remoteRef.key }}
        property: {{ .Values.maasDatabase.externalSecret.remoteRef.property }}
  {{- end }}
{{- end }}
