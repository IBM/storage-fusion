{{- if and .Values.maasDatabase.internal.enabled (not .Values.maasDatabase.external) .Values.maasDatabase.internal.externalSecret.enabled }}
---
# ─────────────────────────────────────────────────────────────────────────────
# maas-postgres-creds ExternalSecret — managed by External Secrets Operator.
#
# ESO resolves this CR and writes the real Secret (maas-postgres-creds) into
# maasDatabase.internal.namespace. The Deployment already reads credentials
# from that Secret via secretKeyRef — no Deployment changes required.
#
# The target Secret name is controlled by internal.externalSecret.targetName
# (defaults to "maas-postgres-creds"). Override during testing so the live
# secret is not touched:
#
#   maasDatabase:
#     internal:
#       externalSecret:
#         enabled: true
#         targetName: maas-postgres-creds-eso-test   # ← safe test name
#
# Prerequisites:
#   1. External Secrets Operator installed (external-secrets-operator Helm chart).
#   2. A ClusterSecretStore (or SecretStore) named by externalSecret.secretStoreRef.name
#      exists and is Ready in the cluster.
#   3. Vault secret must contain keys: username, password, database
#      e.g. vault kv put secret/maas/postgres username=maas password=<pw> database=maas
#
# Ref: maas-setup.md §Database Setup; deploying-external-secrets-guide.md
# ─────────────────────────────────────────────────────────────────────────────
{{- $targetName := .Values.maasDatabase.internal.externalSecret.targetName | default "maas-postgres-creds" }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $targetName }}
  namespace: {{ .Values.maasDatabase.internal.namespace }}
  annotations:
    # Wave 1 — same wave as the Helm-managed Secret so the Deployment can
    # reference it at the same point in the sync order regardless of path.
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    helm.sh/resource-policy: keep
  labels:
    app: maas-postgres
    purpose: {{ .Values.maasDatabase.internal.purpose }}
    {{- include "maas-platform.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.maasDatabase.internal.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.maasDatabase.internal.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.maasDatabase.internal.externalSecret.secretStoreRef.kind }}
  target:
    name: {{ $targetName }}
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_USER
      remoteRef:
        key: {{ .Values.maasDatabase.internal.externalSecret.remoteRef.key }}
        property: username
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: {{ .Values.maasDatabase.internal.externalSecret.remoteRef.key }}
        property: password
    - secretKey: POSTGRES_DB
      remoteRef:
        key: {{ .Values.maasDatabase.internal.externalSecret.remoteRef.key }}
        property: database
{{- end }}
