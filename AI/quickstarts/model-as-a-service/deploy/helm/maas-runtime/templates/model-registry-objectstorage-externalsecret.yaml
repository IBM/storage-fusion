{{- if and .Values.modelRegistry.enabled .Values.modelRegistry.objectStorage.enabled (not .Values.modelRegistry.objectStorage.autoCreateBucket) .Values.modelRegistry.objectStorage.externalSecret.enabled }}
---
# ─────────────────────────────────────────────────────────────────────────────
# model-registry-object-storage ExternalSecret — managed by External Secrets Operator.
#
# ESO resolves this CR and writes the real Secret (model-registry-object-storage)
# into modelRegistry.namespace. The CronJob (catalog-sync) already mounts it by
# name — no workload changes required.
#
# Design — split between Vault and values:
#
#   Vault stores four fields — the three sensitive credentials PLUS the bucket
#   name. The bucket name belongs in Vault when autoCreateBucket: false because:
#     - The bucket was likely created out-of-band (OBC-generated suffix, IBM COS
#       console, AWS S3, etc.) and its exact name is not known until after
#       provisioning — storing it in values.yaml requires a Git commit to update.
#     - Keeping all four fields together in Vault means a single `vault kv put`
#       command captures the complete object-storage configuration.
#
#   Vault fields:
#     access-key-id      → AWS_ACCESS_KEY_ID
#     secret-access-key  → AWS_SECRET_ACCESS_KEY
#     endpoint           → AWS_S3_ENDPOINT
#     bucket             → AWS_S3_BUCKET
#
#   Non-sensitive config stamped from values via target.template
#   (these never change per-bucket, safe in Git):
#     AWS_DEFAULT_REGION ← objectStorage.region
#     AWS_STORAGE_CLASS  ← objectStorage.storageClass
#     VERIFY_SSL         ← objectStorage.verifySSL
#
# Vault command:
#   vault kv put secret/maas/model-registry/object-storage \
#     access-key-id="<key>" \
#     secret-access-key="<secret>" \
#     endpoint="https://s3.example.com" \
#     bucket="<exact-bucket-name>"
#
# Testing without touching the live secret:
#   modelRegistry:
#     objectStorage:
#       externalSecret:
#         enabled: true
#         targetName: model-registry-object-storage-eso-test   # ← safe test name
#
# Prerequisites:
#   1. External Secrets Operator installed (external-secrets-operator Helm chart).
#   2. A ClusterSecretStore (or SecretStore) named by externalSecret.secretStoreRef.name
#      exists and is Ready in the cluster.
#   3. Vault path pre-populated BEFORE the first ArgoCD sync (see above).
#   4. modelRegistry.objectStorage.autoCreateBucket must be false.
#   5. Clear accessKeyId, secretAccessKey, endpoint in values (set to "").
#      bucket in values is ignored when ESO is active — Vault is the source.
#
# Ref: VAULT-SECRET-SETUP.md; deploying-external-secrets-guide.md
# ─────────────────────────────────────────────────────────────────────────────
{{- $os  := .Values.modelRegistry.objectStorage }}
{{- $eso := $os.externalSecret }}
{{- $targetName := $eso.targetName | default "model-registry-object-storage" }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $targetName }}
  namespace: {{ .Values.modelRegistry.namespace }}
  annotations:
    # Wave 1 — ensure ESO resolves the Secret before the CronJob and ModelRegistry
    # CR are applied, mirroring the wave of the Helm-managed Secret.
    argocd.argoproj.io/sync-wave: "1"
    # Suppress ArgoCD dry-run failures when the ExternalSecret CRD is not yet installed.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    helm.sh/resource-policy: keep
  labels:
    app.kubernetes.io/component: ibm-fusion-storage
    {{- include "maas-runtime.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $eso.refreshInterval }}
  secretStoreRef:
    name: {{ $eso.secretStoreRef.name }}
    kind: {{ $eso.secretStoreRef.kind }}
  target:
    name: {{ $targetName }}
    creationPolicy: Owner
    # ── Assemble the full Secret via ESO target.template ──────────────────────
    # Sensitive fields (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_S3_ENDPOINT)
    # are resolved from Vault via the data[] block below and referenced as
    # template variables. Non-sensitive fields are stamped directly from values.
    template:
      type: Opaque
      data:
        AWS_ACCESS_KEY_ID:     "{{ "{{" }} .accessKeyId {{ "}}" }}"
        AWS_SECRET_ACCESS_KEY: "{{ "{{" }} .secretAccessKey {{ "}}" }}"
        AWS_S3_ENDPOINT:       "{{ "{{" }} .endpoint {{ "}}" }}"
        AWS_S3_BUCKET:         "{{ "{{" }} .bucket {{ "}}" }}"
        AWS_DEFAULT_REGION:    {{ $os.region | quote }}
        AWS_STORAGE_CLASS:     {{ $os.storageClass | quote }}
        VERIFY_SSL:            {{ $os.verifySSL | quote }}
  data:
    # Fetch all four object-storage fields from Vault.
    - secretKey: accessKeyId
      remoteRef:
        key: {{ $eso.remoteRef.key }}
        property: access-key-id
    - secretKey: secretAccessKey
      remoteRef:
        key: {{ $eso.remoteRef.key }}
        property: secret-access-key
    - secretKey: endpoint
      remoteRef:
        key: {{ $eso.remoteRef.key }}
        property: endpoint
    - secretKey: bucket
      remoteRef:
        key: {{ $eso.remoteRef.key }}
        property: bucket
{{- end }}
