{{- if and .Values.modelRegistry.enabled .Values.modelRegistry.database.external .Values.modelRegistry.database.externalSecret.enabled }}
---
# ─────────────────────────────────────────────────────────────────────────────
# model-registry-db-credentials ExternalSecret — managed by External Secrets Operator.
#
# ESO resolves this CR and writes the real Secret (model-registry-db-credentials)
# into modelRegistry.namespace. The ModelRegistry CR already reads DB_PASSWORD
# from that Secret via spec.postgres.passwordSecret — no CR changes required.
#
# Design:
#   Only the password is fetched from Vault. The remaining non-sensitive fields
#   (host, port, database, username, sslMode) are injected directly from
#   modelRegistry.database.externalDatabase.* values so a single Vault path
#   stays minimal. Change the password in Vault once and ESO propagates it
#   automatically on the next refresh.
#
# Vault secret layout (at remoteRef.key):
#   password   → DB_PASSWORD
#
#   e.g. vault kv put secret/maas/model-registry/database \
#              password="<strong-password>"
#
# Testing without touching the live secret:
#   modelRegistry:
#     database:
#       externalSecret:
#         enabled: true
#         targetName: model-registry-db-credentials-eso-test   # ← safe test name
#
# Prerequisites:
#   1. External Secrets Operator installed (external-secrets-operator Helm chart).
#   2. A ClusterSecretStore (or SecretStore) named by externalSecret.secretStoreRef.name
#      exists and is Ready in the cluster.
#   3. Vault path pre-populated BEFORE the first ArgoCD sync:
#        vault kv put secret/maas/model-registry/database password=<pw>
#   4. modelRegistry.database.external must be true (no in-cluster Postgres).
#
# Ref: VAULT-SECRET-SETUP.md; deploying-external-secrets-guide.md
# ─────────────────────────────────────────────────────────────────────────────
{{- $db := .Values.modelRegistry.database }}
{{- $eso := $db.externalSecret }}
{{- $ext := $db.externalDatabase }}
{{- $targetName := $eso.targetName | default "model-registry-db-credentials" }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $targetName }}
  namespace: {{ .Values.modelRegistry.namespace }}
  annotations:
    # Wave 1 — same wave as the Helm-managed Secret so the ModelRegistry CR
    # sees it at the same point in the sync order regardless of which path is chosen.
    argocd.argoproj.io/sync-wave: "1"
    # Suppress ArgoCD dry-run failures when the ExternalSecret CRD is not yet installed.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    helm.sh/resource-policy: keep
  labels:
    app.kubernetes.io/component: model-registry-database
    {{- include "maas-runtime.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $eso.refreshInterval }}
  secretStoreRef:
    name: {{ $eso.secretStoreRef.name }}
    kind: {{ $eso.secretStoreRef.kind }}
  target:
    name: {{ $targetName }}
    creationPolicy: Owner
    # ── Assemble the full credential set via ESO target.template ──────────────
    # Non-sensitive fields are stamped directly from values; only the password
    # is pulled from Vault. This keeps Vault minimal (one field) and the Secret
    # self-contained so no downstream resource needs changing.
    template:
      type: Opaque
      data:
        DB_HOST:    {{ $ext.host | quote }}
        DB_PORT:    {{ $ext.port | quote }}
        DB_NAME:    {{ $ext.database | quote }}
        DB_USER:    {{ $ext.username | quote }}
        DB_SSLMODE: {{ $ext.sslMode | quote }}
        DB_PASSWORD: "{{ "{{" }} .password {{ "}}" }}"
  data:
    # Fetch only the password from Vault — single credential in the secret store.
    - secretKey: password
      remoteRef:
        key: {{ $eso.remoteRef.key }}
        property: {{ $eso.remoteRef.property }}
{{- end }}
