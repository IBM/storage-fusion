{{- if and .Values.huggingface.enabled .Values.huggingface.externalSecret.enabled }}
---
# ─────────────────────────────────────────────────────────────────────────────
# huggingface-token ExternalSecret — managed by External Secrets Operator.
#
# ESO resolves this CR and writes the real Secret (huggingface-token) into
# modelRegistry.namespace (e.g. rhoai-model-registries). The reconciler's
# _load_hf_token() method reads key "token" from that Secret using the
# Kubernetes API — no Deployment change required.
#
# IMPORTANT: The Secret is created in modelRegistry.namespace, NOT in
# .Values.namespace. This matches where the reconciler looks for it:
#   self.k8s_core.read_namespaced_secret("huggingface-token", self.target_namespace)
#
# Vault command:
#   vault kv put secret/maas/model-registry-gitops/huggingface \
#     token="hf_xxxxxxxxxxxxxxxxxxxx"
#
# Testing without touching the live secret:
#   huggingface:
#     externalSecret:
#       enabled: true
#       targetName: huggingface-token-eso-test   # ← safe test name
#
# Prerequisites:
#   1. External Secrets Operator installed (external-secrets-operator Helm chart).
#   2. A ClusterSecretStore (or SecretStore) named by externalSecret.secretStoreRef.name
#      exists and is Ready in the cluster.
#   3. Vault path pre-populated BEFORE the first ArgoCD sync (see above).
#   4. huggingface.enabled must be true.
# ─────────────────────────────────────────────────────────────────────────────
{{- $hf         := .Values.huggingface }}
{{- $eso        := $hf.externalSecret }}
{{- $targetName := $eso.targetName | default $hf.secretName }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $targetName }}
  namespace: {{ .Values.modelRegistry.namespace }}
  annotations:
    # Wave 1 — ensure the Secret exists in modelRegistry.namespace before the
    # reconciler Deployment starts and calls _load_hf_token().
    argocd.argoproj.io/sync-wave: "1"
    # Suppress ArgoCD dry-run failures when the ExternalSecret CRD is not yet installed.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    helm.sh/resource-policy: keep
  labels:
    app.kubernetes.io/component: huggingface-token
    {{- include "model-registry-gitops.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $eso.refreshInterval }}
  secretStoreRef:
    name: {{ $eso.secretStoreRef.name }}
    kind: {{ $eso.secretStoreRef.kind }}
  target:
    name: {{ $targetName }}
    creationPolicy: Owner
  data:
    # Fetch the Hugging Face token from Vault.
    # The reconciler reads this Secret key: secret.data["token"]
    - secretKey: token
      remoteRef:
        key: {{ $eso.remoteRef.key }}
        property: {{ $eso.remoteRef.property }}
{{- end }}
