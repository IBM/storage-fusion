---
# ── CAS MCP API ───────────────────────────────────────────────────────────────
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: fusion-cas-mcp-api-<cluster-id>
  title: "IBM Fusion CAS MCP Server — <cluster-id>"
  description: >
    CAS MCP Server on <cluster-id>. JSON-RPC 2.0 over HTTP and SSE streamable transport.
    Standard endpoint (POST): /api/proxy/fusion-<cluster-id>-cas/cas/api/v1/mcp
    Streamable SSE (trailing slash required): /api/proxy/fusion-<cluster-id>-cas/cas/api/v1/mcp-streamable/
    Tools: list_vector_stores, search_vector_stores, get_vector_store_file_content
  tags: [fusion, cas, mcp, "<cluster-id>", ai, vector-storage, watsonx]
  annotations:
    fusion.ibm.com/cluster-id: "<cluster-id>"
    fusion.ibm.com/service-type: "cas"
    fusion.ibm.com/mcp-endpoint: "https://console-ibm-spectrum-fusion-ns.apps.<cluster-id>.fusion.example.com/cas/api/v1/mcp"
    fusion.ibm.com/mcp-proxy: "/api/proxy/fusion-<cluster-id>-cas/cas/api/v1/mcp"
    backstage.io/source-location: "url:https://console-ibm-spectrum-fusion-ns.apps.<cluster-id>.fusion.example.com/cas/overview"
  links:
    - url: https://console-ibm-spectrum-fusion-ns.apps.<cluster-id>.fusion.example.com/cas/api/v1/docs
      title: "CAS Swagger UI"
      icon: code
    - url: https://www.ibm.com/docs/en/fusion-software/2.13.0?topic=cas-content-aware-storage-apis
      title: "IBM Docs — CAS REST APIs"
      icon: article
    - url: https://www.ibm.com/docs/en/fusion-software/2.13.0?topic=cas-integrating-model-context-protocol-mcp
      title: "IBM Docs — CAS MCP Integration"
      icon: article
spec:
  type: openapi
  lifecycle: production
  owner: group:default/fusion-team
  system: fusion-<cluster-id>
  definition: |
    openapi: "3.0.0"
    info:
      title: IBM Fusion CAS MCP Server (<cluster-id>)
      version: "2.13.x"
    servers:
      - url: /api/proxy/fusion-<cluster-id>-cas
        description: Via RHDH Proxy (no cluster access needed)
      - url: https://console-ibm-spectrum-fusion-ns.apps.<cluster-id>.fusion.example.com
        description: Direct (self-hosted)
    paths:
      /cas/api/v1/mcp:
        post:
          summary: CAS MCP — Standard (POST, JSON-RPC 2.0)
          tags: [MCP-Standard]
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  type: object
                  required: [jsonrpc, id, method]
                  properties:
                    jsonrpc: {type: string, enum: ["2.0"]}
                    id: {type: integer}
                    method: {type: string, enum: [initialize, "tools/list", "tools/call"]}
                    params: {type: object}
                examples:
                  list_tools:
                    value: {jsonrpc: "2.0", id: 1, method: "tools/list", params: {}}
          responses:
            "200": {description: JSON-RPC 2.0 response}
      /cas/api/v1/mcp-streamable/:
        post:
          summary: CAS MCP — Streamable SSE (trailing slash required)
          tags: [MCP-Streamable]
          requestBody:
            required: true
            content:
              application/json:
                schema: {type: object}
          responses:
            "200": {description: SSE event stream}
      /cas/api/v1/docs:
        get:
          summary: CAS Swagger UI — Interactive REST API Explorer
          tags: [Swagger]
          responses:
            "200": {description: Swagger UI HTML page}
      /cas/api/v1/health:
        get:
          summary: CAS Health Check
          tags: [Health]
          responses:
            "200": {description: Service healthy}
