# =============================================================================
# secrets-template.yaml — Secret Creation Reference
#
# DO NOT apply this file. It contains placeholder values only.
# Use the exact `oc create secret` commands below as your guide.
#
# All secrets live in the RHDH namespace ONLY:
#   RHDH_NS=<rhdh-namespace>
#
# REQUIRED secrets:
#   1. rhdh-github-ibm-token            — GitHub IBM Enterprise access token
#   2. rhdh-github-oauth                — GitHub OAuth app (RHDH login)
#   3. cas-<cluster-id>-config          — CAS console URL (proxy target)
#   4. fusion-<cluster-id>-sa-token     — SA token for DCS K8s plugin tab
#   5. fusion-<cluster-id>-cas-sa-token — SA token for CAS K8s plugin tab
#
# Secrets 3–5 are required once per self-hosted cluster.
# Proxy-only clusters (template-registered) do NOT need secrets 3–5.
#
# OPTIONAL secrets:
#   6. rhdh-argocd-credentials — ArgoCD admin password (ArgoCD plugin)
# =============================================================================

# =============================================================================
# SECRET 1 — GitHub IBM Enterprise token
#   Used by: integrations.github token + proxy /github-ibm-api Authorization header
#   Key injected as: GITHUB_IBM_TOKEN
# =============================================================================
#
# oc create secret generic rhdh-github-ibm-token \
#   --from-literal=GITHUB_IBM_TOKEN="ghp_xxxxxxxxxxxxxxxxxxxx" \
#   -n <rhdh-namespace>

# =============================================================================
# SECRET 2 — GitHub OAuth (RHDH login)
#   Used by: auth provider in app-config-auth-github
#   Keys injected as: clientId, clientSecret
# =============================================================================
#
# oc create secret generic rhdh-github-oauth \
#   --from-literal=clientId="Iv1.xxxxxxxxxxxx" \
#   --from-literal=clientSecret="xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" \
#   -n <rhdh-namespace>

# =============================================================================
# SECRET 3 — CAS console URL  (one per self-hosted cluster)
#   Used by: proxy /fusion-<cluster-id>-cas → target: ${CAS_<CLUSTER_ID>_CONSOLE_URL}
#   Only ONE key is needed — the console base URL (no trailing slash).
#   All CAS subpaths (/cas/api/v1/docs, /mcp, /mcp-streamable/, /health) are
#   subpaths of this single route and need no separate entries.
# =============================================================================
#
# oc create secret generic cas-<cluster-id>-config \
#   --from-literal=CAS_<CLUSTER_ID>_CONSOLE_URL="https://console-ibm-spectrum-fusion-ns.apps.<cluster-domain>" \
#   -n <rhdh-namespace>

# =============================================================================
# SECRET 4 — DCS SA token  (one per self-hosted cluster)
#   Used by: kubernetes.clusters[name=fusion-<cluster-id>-dcs].serviceAccountToken
#   Namespace where SA lives on the target cluster: ibm-data-cataloging
#   Key injected as: FUSION_<CLUSTER_ID>_SA_TOKEN
#
#   Prerequisites (run on the target cluster):
#     oc apply -n ibm-data-cataloging -f k8s/sa-rbac.yaml
#     oc apply -f k8s/sa-rbac.yaml    # ClusterRole + rhdh-fusion-reader-dcs binding
#
# TOKEN=$(oc create token rhdh-fusion-reader \
#           -n ibm-data-cataloging --duration=8760h)
# oc create secret generic fusion-<cluster-id>-sa-token \
#   --from-literal=FUSION_<CLUSTER_ID>_SA_TOKEN="${TOKEN}" \
#   -n <rhdh-namespace> \
#   --dry-run=client -o yaml | oc apply -f -

# =============================================================================
# SECRET 5 — CAS SA token  (one per self-hosted cluster)
#   Used by: kubernetes.clusters[name=fusion-<cluster-id>-cas].serviceAccountToken
#   Namespace where SA lives on the target cluster: ibm-cas
#   Key injected as: FUSION_<CLUSTER_ID>_CAS_SA_TOKEN
#
#   Prerequisites (run on the target cluster):
#     oc apply -n ibm-cas -f k8s/sa-rbac.yaml
#     oc apply -f k8s/sa-rbac.yaml    # ClusterRole + rhdh-fusion-reader-cas binding
#
# TOKEN=$(oc create token rhdh-fusion-reader \
#           -n ibm-cas --duration=8760h)
# oc create secret generic fusion-<cluster-id>-cas-sa-token \
#   --from-literal=FUSION_<CLUSTER_ID>_CAS_SA_TOKEN="${TOKEN}" \
#   -n <rhdh-namespace> \
#   --dry-run=client -o yaml | oc apply -f -

# =============================================================================
# SECRET 6 (optional) — ArgoCD credentials
#   Used by: ArgoCD plugin
# =============================================================================
#
# oc create secret generic rhdh-argocd-credentials \
#   --from-literal=ARGOCD_PASSWORD="your-argocd-admin-password" \
#   -n <rhdh-namespace>
