{{- if and .Values.developerHub.enabled .Values.developerHub.fusionServices.enabled .Values.developerHub.fusionServices.dynamicPlugins.enabled }}
{{- $homepageEnabled := and .Values.developerHub.config.homepage .Values.developerHub.config.homepage.enabled }}
{{- $rhoaiEnabled := and .Values.developerHub.fusion .Values.developerHub.fusion.ai .Values.developerHub.fusion.ai.rhoaiConnector .Values.developerHub.fusion.ai.rhoaiConnector.enabled }}
---
# fusion-ai-dynamic-plugins ConfigMap
#
# RHDH built-in plugins for IBM Fusion AI Service discovery.
# All plugins ship with Red Hat Developer Hub; no custom plugins required.
#
# Toggle: developerHub.fusionServices.dynamicPlugins.enabled: true
apiVersion: v1
kind: ConfigMap
metadata:
  name: fusion-ai-dynamic-plugins
  namespace: {{ include "fusion-developer-hub.namespace" . }}
  labels:
    {{- include "fusion-developer-hub.labels" . | nindent 4 }}
    app.kubernetes.io/component: fusion-ai-dynamic-plugins
  annotations:
    argocd.argoproj.io/sync-wave: "50"
data:
  dynamic-plugins.yaml: |
    includes:
      - dynamic-plugins.default.yaml
    plugins:

      # ── SCAFFOLDER GITHUB MODULE ───────────────────────────────────────────
      # Required for publish:github and publish:github:pull-request actions
      # used by the Add CAS/DCS Cluster self-service templates.
      - package: './dynamic-plugins/dist/backstage-plugin-scaffolder-backend-module-github-dynamic'
        disabled: false

      # ── HOME PAGE ─────────────────────────────────────────────────────────
      {{- if $homepageEnabled }}
      - package: './dynamic-plugins/dist/red-hat-developer-hub-backstage-plugin-dynamic-home-page'
        disabled: false
      {{- end }}

      # ── RHOAI MODEL CATALOG ───────────────────────────────────────────────
      # Required for NVIDIA, Fusion, and Red Hat blueprint catalog entity ingestion.
      # Without these plugins the catalog backend cannot index blueprint entities
      # and all blueprint links return empty results.
      {{- if $rhoaiEnabled }}
      - package: 'oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-catalog-backend-module-model-catalog:bs_1.42.5__0.7.0!red-hat-developer-hub-backstage-plugin-catalog-backend-module-model-catalog'
        disabled: false
      - package: 'oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-catalog-techdoc-url-reader-backend:bs_1.42.5__0.3.0!red-hat-developer-hub-backstage-plugin-catalog-techdoc-url-reader-backend'
        disabled: false
      {{- end }}
      
      # ── TECHDOCS ───────────────────────────────────────────────────────────
      # Renders MkDocs documentation inside Developer Hub.
      # Serves DCS and CAS architecture, MCP integration, API, and onboarding docs.
      - package: "./dynamic-plugins/dist/backstage-plugin-techdocs"
        disabled: false
        pluginConfig: {}

      - package: "./dynamic-plugins/dist/backstage-plugin-techdocs-backend-dynamic"
        disabled: false
        pluginConfig: {}

      # ── SCAFFOLDER / SOFTWARE TEMPLATES ───────────────────────────────────
      # Powers Software Templates:
      #   1. Add IBM Fusion CAS Cluster
      #   2. Add IBM Fusion DCS Cluster
      - package: "./dynamic-plugins/dist/backstage-plugin-scaffolder-backend-dynamic"
        disabled: false
        pluginConfig: {}

      - package: "./dynamic-plugins/dist/backstage-plugin-scaffolder"
        disabled: false
        pluginConfig:
          dynamicRoutes:
            - path: /create
              importName: ScaffolderPage

      # ── API DOCS / SWAGGER UI ─────────────────────────────────────────────
      # Renders OpenAPI / Swagger specs inline in the API tab.
      # CAS: /cas/api/v1/docs via RHDH proxy
      # DCS: /api/v1/... via RHDH proxy
      - package: "./dynamic-plugins/dist/backstage-plugin-api-docs"
        disabled: false
        pluginConfig:
          dynamicRoutes:
            - path: /api-docs
              importName: ApiExplorerPage

      # ── CATALOG BACKEND ───────────────────────────────────────────────────
      # Registers and reconciles all Fusion AI Service catalog entities.
      - package: "./dynamic-plugins/dist/backstage-plugin-catalog-backend-dynamic"
        disabled: false
        pluginConfig: {}

      # ── SEARCH ────────────────────────────────────────────────────────────
      # Full-text search across catalog entities, TechDocs, and template content.
      - package: "./dynamic-plugins/dist/backstage-plugin-search"
        disabled: false
        pluginConfig:
          dynamicRoutes:
            - path: /search
              importName: SearchPage

      - package: "./dynamic-plugins/dist/backstage-plugin-search-backend-dynamic"
        disabled: false
        pluginConfig: {}

      - package: "./dynamic-plugins/dist/backstage-plugin-search-backend-module-catalog-dynamic"
        disabled: false
        pluginConfig: {}

      - package: "./dynamic-plugins/dist/backstage-plugin-search-backend-module-techdocs-dynamic"
        disabled: false
        pluginConfig: {}

      # ── HOME PAGE ─────────────────────────────────────────────────────────
      - package: "./dynamic-plugins/dist/backstage-plugin-home"
        disabled: false
        pluginConfig:
          dynamicRoutes:
            - path: /
              importName: HomePage
{{- end }}

