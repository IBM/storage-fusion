{{- if and .Values.developerHub.enabled .Values.developerHub.fusionServices.enabled }}
---
# =============================================================================
# fusion-ai-clusters ConfigMap
#
# GENERATED — do NOT hardcode cluster names, versions, or service details here.
#
# All cluster data is driven by:
#   developerHub.fusionServices.clusters[]  in values.yaml (or env values override)
#
# To add a new cluster: append one entry to the clusters list in values.yaml,
# set argocd.argoproj.io/sync-wave: "50" and push — ArgoCD does the rest.
#
# Each cluster entry may declare:
#   name         — short id used in entity names and URL derivation
#   ocpApiUrl    — https://api.<domain>:6443 (all routes auto-derived from this)
#   clusterType  — self-hosted | proxy-only
#   services.dcs — { enabled, version, namespace, k8s.{tokenEnvVar,labelSelector} }
#   services.cas — { enabled, version, namespace, k8s.{tokenEnvVar,labelSelector} }
#
# Endpoint derivation (all automatic from ocpApiUrl):
#   domain = ocpApiUrl stripped of "https://api." prefix and ":6443" suffix
#   DCS console → https://console-ibm-data-cataloging.apps.<domain>
#   DCS MCP HTTP→ https://dcs-mcp-route-ibm-data-cataloging.apps.<domain>/mcp/http
#   DCS MCP SSE → https://dcs-mcp-route-ibm-data-cataloging.apps.<domain>/mcp
#   CAS console → https://console-ibm-spectrum-fusion-ns.apps.<domain>/cas/overview
#   CAS MCP     → https://console-ibm-spectrum-fusion-ns.apps.<domain>/cas/api/v1/mcp
#   CAS swagger → https://console-ibm-spectrum-fusion-ns.apps.<domain>/cas/api/v1/docs
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: fusion-ai-clusters
  namespace: {{ include "fusion-developer-hub.namespace" . }}
  labels:
    {{- include "fusion-developer-hub.labels" . | nindent 4 }}
    app.kubernetes.io/component: fusion-ai-clusters
  annotations:
    argocd.argoproj.io/sync-wave: "50"
{{- if .Values.developerHub.fusionServices.clusters }}
data:
  {{- $gitRepo   := $.Values.developerHub.fusionServices.gitRepo | default "https://github.com/IBM/storage-fusion" }}
  {{- $gitBranch := $.Values.developerHub.fusionServices.gitBranch | default "main" }}
  {{- $gitBase   := printf "%s/tree/%s/quickstarts/fusion-developerhub/fusion-ai-discovery" $gitRepo $gitBranch }}
  {{- range .Values.developerHub.fusionServices.clusters }}
  {{- $cluster    := . }}
  {{- $name       := .name }}
  {{- /* Skip placeholder entries where name still contains angle brackets */}}
  {{- if or (contains "<" $name) (contains ">" $name) }}{{- continue }}{{- end }}
  {{- $domain     := .ocpApiUrl | trimPrefix "https://api." | trimSuffix ":6443" }}
  {{- $selfHosted := eq (.clusterType | default "proxy-only") "self-hosted" }}
  {{- /* DCS/CAS enabled by default — only disabled when explicitly set false */}}
  {{- $dcsEnabled := not (and .services .services.dcs (eq (toString .services.dcs.enabled) "false")) }}
  {{- $casEnabled := not (and .services .services.cas (eq (toString .services.cas.enabled) "false")) }}
  {{- $dcs        := dict "version" "" "namespace" "ibm-data-cataloging" }}
  {{- if and .services .services.dcs }}{{- $dcs = .services.dcs }}{{- end }}
  {{- $cas        := dict "version" "" "namespace" "ibm-cas" }}
  {{- if and .services .services.cas }}{{- $cas = .services.cas }}{{- end }}

  {{- /* ── Per-cluster catalog file key ─────────────────────────────────── */}}
  fusion-{{ $name }}-catalog-info.yaml: |
    # Generated by Helm from developerHub.fusionServices.clusters[{{ $name }}]
    # Edit values.yaml to update versions, add/remove services, or change cluster type.

    # ── System ───────────────────────────────────────────────────────────────
    apiVersion: backstage.io/v1alpha1
    kind: System
    metadata:
      name: fusion-{{ $name }}
      title: "IBM Fusion HCI — {{ $name }}"
      description: >
        IBM Fusion HCI on {{ $name }}
        ({{ .clusterType | default "proxy-only" }}).
        {{- if $dcsEnabled }}
        DCS {{ $dcs.version | default "n/a" }}.
        {{- end }}
        {{- if $casEnabled }}
        CAS {{ $cas.version | default "n/a" }}.
        {{- end }}
      tags:
        - fusion
        - openshift
        - {{ $name }}
        {{- if $dcsEnabled }}
        - dcs
        {{- end }}
        {{- if $casEnabled }}
        - cas
        {{- end }}
        - {{ .clusterType | default "proxy-only" }}
      annotations:
        fusion.ibm.com/cluster-id: "{{ $name }}"
        fusion.ibm.com/cluster-type: "{{ .clusterType | default "proxy-only" }}"
        backstage.io/source-location: "dir:."
      links:
        - url: https://console-ibm-spectrum-fusion-ns.apps.{{ $domain }}
          title: Fusion HCI Console
          icon: dashboard
        - url: https://console-openshift-console.apps.{{ $domain }}
          title: OCP Console
          icon: web
    spec:
      owner: group:default/fusion-team
      domain: fusion-ai-services

    {{- if $dcsEnabled }}
    ---
    # ── DCS Component ────────────────────────────────────────────────────────
    apiVersion: backstage.io/v1alpha1
    kind: Component
    metadata:
      name: fusion-dcs-{{ $name }}
      title: "IBM Fusion DCS — {{ $name }}"
      description: >
        IBM Fusion Data Cataloging Service (DCS) on {{ $name }} (v{{ $dcs.version | default "see cluster" }}).
        DCS — powered by IBM Spectrum Discover — delivers automated metadata scanning,
        AI-powered classification, and policy-driven data lifecycle management across
        IBM Storage Scale, S3, and file-based data sources. It builds a unified,
        searchable metadata catalog at petabyte scale and exposes an MCP Server for
        natural language catalog queries from AI assistants and IDE tools.
        Click "DCS MCP — Connection Details" to view endpoints and integration guide.
      tags:
        - fusion
        - dcs
        - {{ $name }}
        - data-cataloging
        - mcp
        - ai
        - {{ $cluster.clusterType | default "proxy-only" }}
      annotations:
        fusion.ibm.com/cluster-id: "{{ $name }}"
        fusion.ibm.com/cluster-type: "{{ $cluster.clusterType | default "proxy-only" }}"
        fusion.ibm.com/service-type: "dcs"
        fusion.ibm.com/service-namespace: "{{ $dcs.namespace | default "ibm-data-cataloging" }}"
        fusion.ibm.com/service-version: "{{ $dcs.version | default "" }}"
        fusion.ibm.com/console-url: "https://console-ibm-data-cataloging.apps.{{ $domain }}"
        fusion.ibm.com/mcp-endpoint: "https://dcs-mcp-route-ibm-data-cataloging.apps.{{ $domain }}/mcp/http"
        fusion.ibm.com/mcp-sse-endpoint: "https://dcs-mcp-route-ibm-data-cataloging.apps.{{ $domain }}/mcp"
        fusion.ibm.com/mcp-proxy: "/api/proxy/fusion-{{ $name }}-dcs-mcp/mcp/http"
        fusion.ibm.com/mcp-sse-proxy: "/api/proxy/fusion-{{ $name }}-dcs-mcp/mcp"
        fusion.ibm.com/console-proxy: "/api/proxy/fusion-{{ $name }}-dcs"
        fusion.ibm.com/mcp-available: "true"
        fusion.ibm.com/catalog-visible: "true"
        backstage.io/techdocs-ref: "url:{{ $gitBase }}/techdocs/dcs"
        backstage.io/source-location: "dir:."
      links:
        - url: https://console-ibm-data-cataloging.apps.{{ $domain }}
          title: "DCS Console"
          icon: dashboard
        - url: {{ include "fusion-developer-hub.rhdhBaseUrl" $ }}/catalog/default/api/fusion-dcs-mcp-api-{{ $name }}
          title: "DCS MCP — Connection Details & Integration Guide"
          icon: cloud
        - url: https://www.ibm.com/docs/en/fusion-software/2.13.0?topic=services-data-cataloging
          title: "IBM Docs — Data Cataloging Service"
          icon: article
        - url: https://www.ibm.com/docs/en/fusion-software/2.13.0?topic=capabilities-data-cataloging-mcp-server
          title: "IBM Docs — DCS MCP Server"
          icon: article
        - url: https://www.ibm.com/docs/en/fusion-hci-systems/2.13.0?topic=capabilities-data-cataloging-mcp-server
          title: "IBM Docs — DCS MCP Server (HCI Systems)"
          icon: article
        - url: https://community.ibm.com/community/user/blogs/paul-llamas-virgen/2026/03/06/exploring-your-fusion-data-catalog-with-nlp
          title: "Blog — Exploring Your Catalog with NLP"
          icon: chat
        - url: https://community.ibm.com/community/user/blogs/paul-llamas-virgen/2026/03/06/create-your-ai-agents-on-wx-orch-for-data-catalog
          title: "Blog — AI Agents on watsonx Orchestrate"
          icon: chat
        - url: https://community.ibm.com/community/user/blogs/paul-llamas-virgen/2026/03/06/is-your-mcp-server-healthy-to-explore-your-catalog
          title: "Blog — MCP Health Check Guide"
          icon: chat
        - url: https://community.ibm.com/community/user/blogs/paul-llamas-virgen/2026/03/06/content-aware-ai-autotagging-fusion-data-catalog
          title: "Blog — Content-Aware AI Autotagging"
          icon: chat
    spec:
      type: fusion-service
      lifecycle: production
      owner: group:default/fusion-team
      system: fusion-{{ $name }}
      providesApis:
        - fusion-dcs-mcp-api-{{ $name }}

    ---
    # ── DCS MCP API ──────────────────────────────────────────────────────────
    apiVersion: backstage.io/v1alpha1
    kind: API
    metadata:
      name: fusion-dcs-mcp-api-{{ $name }}
      title: "IBM Fusion DCS MCP Server — {{ $name }}"
      description: >
        DCS MCP Server on {{ $name }} (v{{ $dcs.version | default "see cluster" }}).
        Exposes metadata catalog tools via JSON-RPC 2.0 over HTTP and SSE streaming.
        Connect Bob, VS Code, or watsonx Orchestrate via the proxy or direct endpoint.
      annotations:
        fusion.ibm.com/cluster-id: "{{ $name }}"
        fusion.ibm.com/service-type: "dcs"
        fusion.ibm.com/service-version: "{{ $dcs.version | default "" }}"
        fusion.ibm.com/mcp-endpoint: "https://dcs-mcp-route-ibm-data-cataloging.apps.{{ $domain }}/mcp/http"
        fusion.ibm.com/mcp-proxy: "/api/proxy/fusion-{{ $name }}-dcs-mcp/mcp/http"
        backstage.io/techdocs-ref: "url:{{ $gitBase }}/techdocs/dcs"
        backstage.io/source-location: "dir:."
      links:
        - url: https://dcs-mcp-route-ibm-data-cataloging.apps.{{ $domain }}/mcp/http
          title: "DCS MCP — HTTP transport (POST)"
          icon: cloud
        - url: https://dcs-mcp-route-ibm-data-cataloging.apps.{{ $domain }}/mcp
          title: "DCS MCP — SSE transport"
          icon: cloud
        - url: https://www.ibm.com/docs/en/fusion-software/2.13.0?topic=capabilities-data-cataloging-mcp-server
          title: "IBM Docs — DCS MCP Server"
          icon: article
        - url: https://www.ibm.com/docs/en/fusion-hci-systems/2.13.0?topic=capabilities-data-cataloging-mcp-server
          title: "IBM Docs — DCS MCP Server (HCI Systems)"
          icon: article
        - url: https://www.ibm.com/docs/en/fusion-software/2.13.0?topic=services-data-cataloging
          title: "IBM Docs — Data Cataloging Service"
          icon: article
        - url: https://community.ibm.com/community/user/blogs/paul-llamas-virgen/2026/03/06/exploring-your-fusion-data-catalog-with-nlp
          title: "Blog — Exploring Your Catalog with NLP"
          icon: chat
        - url: https://community.ibm.com/community/user/blogs/paul-llamas-virgen/2026/03/06/create-your-ai-agents-on-wx-orch-for-data-catalog
          title: "Blog — AI Agents on watsonx Orchestrate"
          icon: chat
        - url: https://community.ibm.com/community/user/blogs/paul-llamas-virgen/2026/03/06/is-your-mcp-server-healthy-to-explore-your-catalog
          title: "Blog — MCP Health Check Guide"
          icon: chat
        - url: https://community.ibm.com/community/user/blogs/paul-llamas-virgen/2026/03/06/content-aware-ai-autotagging-fusion-data-catalog
          title: "Blog — Content-Aware AI Autotagging"
          icon: chat
      tags: [fusion, dcs, mcp, {{ $name }}, ai, watsonx]
    spec:
      type: openapi
      lifecycle: production
      owner: group:default/fusion-team
      system: fusion-{{ $name }}
      definition: |
        openapi: "3.0.0"
        info:
          title: IBM Fusion DCS MCP Server ({{ $name }})
          version: "{{ $dcs.version | default "0.0.0" }}"
          description: MCP server for the DCS data catalog on {{ $name }}. All calls are JSON-RPC 2.0.
        servers:
          - url: /api/proxy/fusion-{{ $name }}-dcs-mcp
            description: Via RHDH Proxy (no cluster access needed)
          - url: https://dcs-mcp-route-ibm-data-cataloging.apps.{{ $domain }}
            description: Direct ({{ $cluster.clusterType | default "proxy-only" }})
        paths:
          /mcp/http:
            post:
              summary: DCS MCP — HTTP Endpoint (JSON-RPC 2.0)
              tags: [MCP-HTTP]
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      type: object
                      required: [jsonrpc, id, method]
                      properties:
                        jsonrpc: {type: string, enum: ["2.0"]}
                        id: {type: integer}
                        method: {type: string, enum: [initialize, "tools/list", "tools/call"]}
                        params: {type: object}
              responses:
                "200": {description: JSON-RPC 2.0 response}
          /mcp:
            get:
              summary: DCS MCP — SSE Endpoint (streaming)
              tags: [MCP-SSE]
              responses:
                "200": {description: SSE event stream}
    {{- end }}

    {{- if $casEnabled }}
    ---
    # ── CAS Component ────────────────────────────────────────────────────────
    apiVersion: backstage.io/v1alpha1
    kind: Component
    metadata:
      name: fusion-cas-{{ $name }}
      title: "IBM Fusion CAS — {{ $name }}"
      description: >
        IBM Fusion Content Aware Storage (CAS) on {{ $name }} (v{{ $cas.version | default "see cluster" }}).
        CAS is an AI-native storage service that transforms unstructured data into
        semantically searchable vector embeddings, enabling generative AI applications
        to retrieve relevant content at scale without requiring data movement or separate
        vector databases. It exposes an MCP Server for semantic search from AI assistants
        and IDE tools. Click "CAS MCP — Connection Details" to view endpoints and guide.
      tags:
        - fusion
        - cas
        - {{ $name }}
        - content-aware-storage
        - mcp
        - vector-storage
        - ai
        - {{ $cluster.clusterType | default "proxy-only" }}
      annotations:
        fusion.ibm.com/cluster-id: "{{ $name }}"
        fusion.ibm.com/cluster-type: "{{ $cluster.clusterType | default "proxy-only" }}"
        fusion.ibm.com/service-type: "cas"
        fusion.ibm.com/service-namespace: "{{ $cas.namespace | default "ibm-cas" }}"
        fusion.ibm.com/service-version: "{{ $cas.version | default "" }}"
        fusion.ibm.com/console-url: "https://console-ibm-spectrum-fusion-ns.apps.{{ $domain }}"
        fusion.ibm.com/swagger-url: "https://console-ibm-spectrum-fusion-ns.apps.{{ $domain }}/cas/api/v1/docs"
        fusion.ibm.com/mcp-endpoint: "https://console-ibm-spectrum-fusion-ns.apps.{{ $domain }}/cas/api/v1/mcp"
        fusion.ibm.com/mcp-streamable-endpoint: "https://console-ibm-spectrum-fusion-ns.apps.{{ $domain }}/cas/api/v1/mcp-streamable/"
        fusion.ibm.com/health-endpoint: "https://console-ibm-spectrum-fusion-ns.apps.{{ $domain }}/cas/api/v1/health"
        fusion.ibm.com/mcp-proxy: "/api/proxy/fusion-{{ $name }}-cas/cas/api/v1/mcp"
        fusion.ibm.com/mcp-streamable-proxy: "/api/proxy/fusion-{{ $name }}-cas/cas/api/v1/mcp-streamable/"
        fusion.ibm.com/swagger-proxy: "/api/proxy/fusion-{{ $name }}-cas/cas/api/v1/docs"
        fusion.ibm.com/console-proxy: "/api/proxy/fusion-{{ $name }}-cas/cas/overview"
        fusion.ibm.com/mcp-available: "true"
        fusion.ibm.com/catalog-visible: "true"
        backstage.io/techdocs-ref: "url:{{ $gitBase }}/techdocs/cas"
        backstage.io/source-location: "dir:."
      links:
        - url: https://console-ibm-spectrum-fusion-ns.apps.{{ $domain }}/cas/overview
          title: "CAS Console"
          icon: dashboard
        - url: {{ include "fusion-developer-hub.rhdhBaseUrl" $ }}/catalog/default/api/fusion-cas-mcp-api-{{ $name }}
          title: "CAS MCP — Connection Details & Integration Guide"
          icon: cloud
        - url: https://console-ibm-spectrum-fusion-ns.apps.{{ $domain }}/cas/api/v1/docs
          title: "CAS Swagger UI"
          icon: code
        - url: https://console-ibm-spectrum-fusion-ns.apps.{{ $domain }}/cas/api/v1/health
          title: "CAS Health Check"
          icon: heart
        - url: https://www.ibm.com/docs/en/fusion-software/2.13.0?topic=services-content-aware-storage-cas
          title: "IBM Docs — CAS Overview"
          icon: article
        - url: https://www.ibm.com/docs/en/fusion-software/2.13.0?topic=cas-integrating-model-context-protocol-mcp
          title: "IBM Docs — CAS MCP Integration"
          icon: article
        - url: https://www.ibm.com/docs/en/fusion-software/2.13.0?topic=cas-content-aware-storage-apis
          title: "IBM Docs — CAS REST APIs (Swagger)"
          icon: article
        - url: https://www.ibm.com/docs/en/fusion-software/2.13.0?topic=cas-integrating-watsonx-orchestrate-by-using-mcp
          title: "IBM Docs — CAS + watsonx Orchestrate"
          icon: article
        - url: https://community.ibm.com/community/user/blogs/namita-singroha/2026/03/24/bob-meets-ibm-cas-mcp
          title: "Blog — Bob meets IBM CAS MCP (IBM Community)"
          icon: chat
        - url: https://medium.com/@singrohanamita/ibm-bob-meets-cas-mcp-everything-you-need-to-get-started-95d7e01b7f20
          title: "Blog — IBM Bob meets CAS MCP: Get Started (Medium)"
          icon: chat
        - url: https://research.ibm.com/blog/cas-100-billion-vector-storage-ai
          title: "IBM Research — 100B Vector Storage for AI"
          icon: chat
        - url: https://community.ibm.com/community/user/blogs/jose-ortiz1/2026/01/29/accelerating-content-aware-storage-deployments
          title: "Community — Accelerating CAS Deployments"
          icon: chat
        - url: https://medium.com/@mukherjeetiyasa1998/ibm-content-aware-storage-cas-rethinking-enterprise-data-for-the-generative-ai-era-635d959d2f0b
          title: "Medium — CAS: Rethinking Enterprise Data for GenAI"
          icon: chat
    spec:
      type: fusion-service
      lifecycle: production
      owner: group:default/fusion-team
      system: fusion-{{ $name }}
      providesApis:
        - fusion-cas-mcp-api-{{ $name }}

    ---
    # ── CAS MCP API ──────────────────────────────────────────────────────────
    apiVersion: backstage.io/v1alpha1
    kind: API
    metadata:
      name: fusion-cas-mcp-api-{{ $name }}
      title: "IBM Fusion CAS MCP Server — {{ $name }}"
      description: >
        CAS MCP Server on {{ $name }} (v{{ $cas.version | default "see cluster" }}).
        Exposes three tools — list_vector_stores, search_vector_stores, get_vector_store_file_content —
        via JSON-RPC 2.0 over HTTP and SSE streamable transport.
        Connect Bob, VS Code, or watsonx Orchestrate via the proxy or direct endpoint.
      annotations:
        fusion.ibm.com/cluster-id: "{{ $name }}"
        fusion.ibm.com/service-type: "cas"
        fusion.ibm.com/service-version: "{{ $cas.version | default "" }}"
        fusion.ibm.com/mcp-endpoint: "https://console-ibm-spectrum-fusion-ns.apps.{{ $domain }}/cas/api/v1/mcp"
        fusion.ibm.com/mcp-streamable-endpoint: "https://console-ibm-spectrum-fusion-ns.apps.{{ $domain }}/cas/api/v1/mcp-streamable/"
        fusion.ibm.com/swagger-url: "https://console-ibm-spectrum-fusion-ns.apps.{{ $domain }}/cas/api/v1/docs"
        fusion.ibm.com/mcp-proxy: "/api/proxy/fusion-{{ $name }}-cas/cas/api/v1/mcp"
        fusion.ibm.com/mcp-streamable-proxy: "/api/proxy/fusion-{{ $name }}-cas/cas/api/v1/mcp-streamable/"
        backstage.io/source-location: "dir:."
      links:
        - url: https://console-ibm-spectrum-fusion-ns.apps.{{ $domain }}/cas/api/v1/mcp
          title: "CAS MCP — Standard (POST, JSON-RPC 2.0)"
          icon: cloud
        - url: https://console-ibm-spectrum-fusion-ns.apps.{{ $domain }}/cas/api/v1/mcp-streamable/
          title: "CAS MCP — Streamable SSE (trailing slash required)"
          icon: cloud
        - url: https://console-ibm-spectrum-fusion-ns.apps.{{ $domain }}/cas/api/v1/docs
          title: "CAS Swagger UI"
          icon: code
        - url: https://console-ibm-spectrum-fusion-ns.apps.{{ $domain }}/cas/api/v1/health
          title: "CAS Health Check"
          icon: heart
        - url: https://www.ibm.com/docs/en/fusion-software/2.13.0?topic=cas-integrating-model-context-protocol-mcp
          title: "IBM Docs — CAS MCP Integration"
          icon: article
        - url: https://www.ibm.com/docs/en/fusion-software/2.13.0?topic=cas-content-aware-storage-apis
          title: "IBM Docs — CAS REST APIs"
          icon: article
        - url: https://www.ibm.com/docs/en/fusion-software/2.13.0?topic=services-content-aware-storage-cas
          title: "IBM Docs — CAS Overview"
          icon: article
        - url: https://www.ibm.com/docs/en/fusion-software/2.13.0?topic=cas-integrating-watsonx-orchestrate-by-using-mcp
          title: "IBM Docs — CAS + watsonx Orchestrate"
          icon: article
        - url: https://community.ibm.com/community/user/blogs/namita-singroha/2026/03/24/bob-meets-ibm-cas-mcp
          title: "Blog — Bob meets IBM CAS MCP (IBM Community)"
          icon: chat
        - url: https://medium.com/@singrohanamita/ibm-bob-meets-cas-mcp-everything-you-need-to-get-started-95d7e01b7f20
          title: "Blog — IBM Bob meets CAS MCP: Get Started (Medium)"
          icon: chat
        - url: https://research.ibm.com/blog/cas-100-billion-vector-storage-ai
          title: "IBM Research — 100B Vector Storage for AI"
          icon: chat
        - url: https://community.ibm.com/community/user/blogs/jose-ortiz1/2026/01/29/accelerating-content-aware-storage-deployments
          title: "Community — Accelerating CAS Deployments"
          icon: chat
        - url: https://medium.com/@mukherjeetiyasa1998/ibm-content-aware-storage-cas-rethinking-enterprise-data-for-the-generative-ai-era-635d959d2f0b
          title: "Medium — CAS: Rethinking Enterprise Data for GenAI"
          icon: chat
      tags: [fusion, cas, mcp, {{ $name }}, ai, vector-storage, watsonx]
    spec:
      type: openapi
      lifecycle: production
      owner: group:default/fusion-team
      system: fusion-{{ $name }}
      definition: |
        openapi: "3.0.0"
        info:
          title: IBM Fusion CAS MCP Server ({{ $name }})
          version: "{{ $cas.version | default "0.0.0" }}"
          description: >
            MCP server and REST API for IBM Fusion Content Aware Storage on {{ $name }}.
            Swagger UI at /cas/api/v1/docs on the CAS console route.
        servers:
          - url: /api/proxy/fusion-{{ $name }}-cas
            description: Via RHDH Proxy (no cluster access needed)
          - url: https://console-ibm-spectrum-fusion-ns.apps.{{ $domain }}
            description: Direct ({{ $cluster.clusterType | default "proxy-only" }})
        paths:
          /cas/api/v1/mcp:
            post:
              summary: CAS MCP — Standard (POST, JSON-RPC 2.0)
              tags: [MCP-Standard]
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      type: object
                      required: [jsonrpc, id, method]
                      properties:
                        jsonrpc: {type: string, enum: ["2.0"]}
                        id: {type: integer}
                        method: {type: string, enum: [initialize, "tools/list", "tools/call"]}
                        params: {type: object}
              responses:
                "200": {description: JSON-RPC 2.0 response}
          /cas/api/v1/mcp-streamable/:
            post:
              summary: CAS MCP — Streamable SSE (trailing slash required)
              tags: [MCP-Streamable]
              requestBody:
                required: true
                content:
                  application/json:
