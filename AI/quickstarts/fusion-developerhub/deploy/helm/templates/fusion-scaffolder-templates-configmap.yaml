                  backstage.io/techdocs-ref: "url:https://github.com/IBM/storage-fusion/tree/main/quickstarts/fusion-developerhub/fusion-ai-discovery/techdocs/dcs"
                links:
                  - url: ${{`{{ 'https://console-ibm-data-cataloging.apps.' ~ (parameters.ocpApiUrl | replace('https://api.', '') | replace(':6443', '')) }}`}}
                    title: DCS Console
                    icon: dashboard
                  - url: ${{`{{ 'https://dcs-mcp-route-ibm-data-cataloging.apps.' ~ (parameters.ocpApiUrl | replace('https://api.', '') | replace(':6443', '')) ~ '/mcp/http' }}`}}
