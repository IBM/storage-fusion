                    icon: cloud
                  - url: ${{`{{ 'https://console-ibm-data-cataloging.apps.' ~ (parameters.ocpApiUrl | replace('https://api.', '') | replace(':6443', '')) ~ '/api' }}`}}
                    title: "Swagger / API Explorer"
                    icon: code
                  - url: ${{`{{ 'https://console-openshift-console.apps.' ~ (parameters.ocpApiUrl | replace('https://api.', '') | replace(':6443', '')) }}`}}
                    title: OCP Console
                    icon: web
                  - url: "https://www.ibm.com/docs/en/fusion-software/2.13.0?topic=services-data-cataloging"
                    title: "IBM Docs — Data Cataloging Service"
                    icon: article
                  - url: "https://www.ibm.com/docs/en/fusion-software/2.13.0?topic=capabilities-data-cataloging-mcp-server"
                    title: "IBM Docs — DCS MCP Server"
                    icon: article
                  - url: "https://www.ibm.com/docs/en/fusion-hci-systems/2.13.0?topic=capabilities-data-cataloging-mcp-server"
                    title: "IBM Docs — DCS MCP Server (HCI Systems)"
                    icon: article
                  - url: "https://community.ibm.com/community/user/blogs/paul-llamas-virgen/2026/03/06/exploring-your-fusion-data-catalog-with-nlp"
                    title: "Blog — Exploring Your Catalog with NLP"
                    icon: chat
                  - url: "https://community.ibm.com/community/user/blogs/paul-llamas-virgen/2026/03/06/create-your-ai-agents-on-wx-orch-for-data-catalog"
                    title: "Blog — AI Agents on watsonx Orchestrate"
                    icon: chat
                  - url: "https://community.ibm.com/community/user/blogs/paul-llamas-virgen/2026/03/06/is-your-mcp-server-healthy-to-explore-your-catalog"
                    title: "Blog — MCP Health Check Guide"
                    icon: chat
                  - url: "https://community.ibm.com/community/user/blogs/paul-llamas-virgen/2026/03/06/content-aware-ai-autotagging-fusion-data-catalog"
                    title: "Blog — Content-Aware AI Autotagging"
                    icon: chat
              spec:
                type: fusion-service
                lifecycle: production
                owner: group:default/fusion-team
                system: fusion-ai-services
      output:
        text:
          - title: "DCS Cluster Added ✅"
            content: |
              ## IBM Fusion DCS — `${{`{{ parameters.clusterName }}`}}`

              Your cluster is now visible in the Developer Hub catalog.

              ---

              ## Endpoints

              | Resource | URL |
              |---|---|
              | DCS Console | ${{`{{ 'https://console-ibm-data-cataloging.apps.' ~ (parameters.ocpApiUrl | replace("https://api.", "") | replace(":6443", "")) }}`}} |
              | MCP HTTP (JSON-RPC 2.0) | ${{`{{ 'https://dcs-mcp-route-ibm-data-cataloging.apps.' ~ (parameters.ocpApiUrl | replace("https://api.", "") | replace(":6443", "")) ~ '/mcp/http' }}`}} |
              | MCP SSE (streaming) | ${{`{{ 'https://dcs-mcp-route-ibm-data-cataloging.apps.' ~ (parameters.ocpApiUrl | replace("https://api.", "") | replace(":6443", "")) ~ '/mcp' }}`}} |
              | Swagger / API Explorer | ${{`{{ 'https://console-ibm-data-cataloging.apps.' ~ (parameters.ocpApiUrl | replace("https://api.", "") | replace(":6443", "")) ~ '/api' }}`}} |
              | OCP Console | ${{`{{ 'https://console-openshift-console.apps.' ~ (parameters.ocpApiUrl | replace("https://api.", "") | replace(":6443", "")) }}`}} |

              ---

              ## Use the MCP Endpoint

              **VS Code `.vscode/mcp.json`:**
              ```json
              {
                "mcpServers": {
                  "${{`{{ 'fusion-dcs-' ~ parameters.clusterName }}`}}": {
                    "url": "${{`{{ 'https://dcs-mcp-route-ibm-data-cataloging.apps.' ~ (parameters.ocpApiUrl | replace("https://api.", "") | replace(":6443", "")) ~ '/mcp/http' }}`}}",
                    "transport": "http"
                  }
                }
              }
              ```

              **watsonx Orchestrate:**
              ```yaml
              mcp_servers:
                - name: ${{`{{ 'fusion-dcs-' ~ parameters.clusterName }}`}}
                  connection_type: http
                  url: ${{`{{ 'https://dcs-mcp-route-ibm-data-cataloging.apps.' ~ (parameters.ocpApiUrl | replace("https://api.", "") | replace(":6443", "")) ~ '/mcp/http' }}`}}
              ```

              ---

              ## MCP Tools

              | Tool | Description |
              |---|---|
              | `dcs_file_search` | Search files in the data catalog |
              | `dcs_get_registered_tags` | List all registered tags |
              | `dcs_get_recommend_tags` | AI-recommended tags for a dataset |
              | `dcs_create_tag` | Create a metadata tag |
              | `dcs_create_policy` | Create a data policy |
              | `dcs_get_policies` | List all policies |
              | `dcs_set_credentials` | Configure data source credentials |

              > To remove: open the component in the catalog → three-dot menu (**⋮**) → **Unregister entity**.
        links:
          - title: "View in Catalog"
            url: ${{`{{ '/catalog/default/component/fusion-dcs-' ~ parameters.clusterName }}`}}
            icon: catalog
