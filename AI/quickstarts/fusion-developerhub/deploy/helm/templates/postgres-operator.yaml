{{- if .Values.operators.enabled }}
{{- if .Values.operators.postgres.enabled }}
{{- $existingCSV := lookup "operators.coreos.com/v1alpha1" "ClusterServiceVersion" .Values.operators.postgres.namespace "postgresoperator.v5.8.8" }}
{{- $existingCSVAny := lookup "operators.coreos.com/v1alpha1" "ClusterServiceVersion" .Values.operators.postgres.namespace "" }}
{{- $existingSubscription := lookup "operators.coreos.com/v1alpha1" "Subscription" .Values.operators.postgres.namespace "crunchy-postgres-operator" }}
{{- $skipInstall := and .Values.operators.skipIfExists (or $existingCSV $existingCSVAny $existingSubscription) }}
{{- if not $skipInstall }}
---
# Namespace for PostgreSQL Operator
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.operators.postgres.namespace }}
  labels:
    {{- include "fusion-developer-hub.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres-operator
  annotations:
    {{- include "fusion-developer-hub.annotations" . | nindent 4 }}
    {{- if not .Values.argocd.enabled }}
    # helm hooks are used only in plain Helm installs to enforce creation order.
    # When argocd.enabled=true these are omitted; ArgoCD uses sync-wave instead.
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    {{- end }}
    # sync-wave ensures the Namespace exists before the OperatorGroup and Subscription
    # that reference it (waves 20 and 30). ArgoCD applies resources in ascending wave order.
    argocd.argoproj.io/sync-wave: "0"
---
# OperatorGroup for PostgreSQL Operator
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: postgres-operator-group
  namespace: {{ .Values.operators.postgres.namespace }}
  labels:
    {{- include "fusion-developer-hub.labels" . | nindent 4 }}
  annotations:
    {{- if not .Values.argocd.enabled }}
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-9"
    {{- end }}
    argocd.argoproj.io/sync-wave: "20"
    # SkipDryRunOnMissingResource: OLM populates .status after the OperatorGroup is
    # created; ArgoCD's dry-run (server-side apply validation) fails when the
    # operators.coreos.com/v1 webhook is absent on the cluster. This option makes
    # ArgoCD skip the dry-run for this resource, preventing spurious sync failures.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  {{- if .Values.operators.postgres.watchAllNamespaces }}
  # Watch all namespaces
  {{- else }}
  targetNamespaces:
    - {{ .Values.operators.postgres.namespace }}
  {{- end }}
---
# Subscription for PostgreSQL Operator (Crunchy Postgres for Kubernetes)
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: crunchy-postgres-operator
  namespace: {{ .Values.operators.postgres.namespace }}
  labels:
    {{- include "fusion-developer-hub.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres-operator
  annotations:
    {{- if not .Values.argocd.enabled }}
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-8"
    {{- end }}
    argocd.argoproj.io/sync-wave: "30"
    # Replace=true: OLM Subscriptions are immutable once the installPlan is created;
    # ArgoCD's default patch strategy causes "field is immutable" errors on re-sync.
    # Replace=true forces a delete+recreate instead of a patch, which is safe here
    # because OLM re-evaluates the Subscription and continues from its current state.
    # SkipDryRunOnMissingResource: avoids dry-run failures before OLM CRDs are ready.
    argocd.argoproj.io/sync-options: Replace=true,SkipDryRunOnMissingResource=true
spec:
  channel: {{ .Values.operators.postgres.channel }}
  name: crunchy-postgres-operator
  source: {{ .Values.operators.postgres.source | default "certified-operators" }}
  sourceNamespace: openshift-marketplace
  {{- if .Values.operators.postgres.startingCSV }}
  startingCSV: {{ .Values.operators.postgres.startingCSV }}
  {{- end }}
  installPlanApproval: {{ .Values.operators.postgres.installPlanApproval | default "Automatic" }}
---
# Wait for operator to be ready
apiVersion: batch/v1
kind: Job
metadata:
  name: wait-for-postgres-operator
  namespace: {{ .Values.operators.postgres.namespace }}
  labels:
    {{- include "fusion-developer-hub.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres-operator-setup
  annotations:
    {{- if not .Values.argocd.enabled }}
    # In plain Helm: runs after install/upgrade completes, deleted before re-creation.
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "1"
    helm.sh/hook-delete-policy: before-hook-creation
    {{- end }}
    argocd.argoproj.io/sync-wave: "40"
    # Force=true,Replace=true: Jobs are immutable after creation. On re-sync ArgoCD cannot
    # patch a completed Job, so Force+Replace ensures the old Job is deleted and a fresh
    # one is created to re-validate operator readiness after upgrades.
    # SkipDryRunOnMissingResource: prevents dry-run failures if batch/v1 Job webhook is absent.
    argocd.argoproj.io/sync-options: Force=true,Replace=true,SkipDryRunOnMissingResource=true
    # argocd.argoproj.io/hook: Sync — runs this Job on every ArgoCD sync so operator
    # readiness is re-confirmed after each upgrade. BeforeHookCreation deletes any
    # previously completed Job pod before creating a new one (equivalent to helm's
    # before-hook-creation delete policy).
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  template:
    metadata:
      labels:
        {{- include "fusion-developer-hub.labels" . | nindent 8 }}
    spec:
      serviceAccountName: postgres-setup-sa
      restartPolicy: OnFailure
      containers:
      - name: wait
        image: {{ .Values.global.toolsImage }}
        command:
        - /bin/bash
        - -c
        - |
          set -e
          echo "Waiting for Crunchy PostgreSQL operator to be ready..."
          
          # Wait for CSV to be succeeded (max 10 minutes)
          for i in {1..120}; do
            CSV_PHASE=$(oc get csv -n {{ .Values.operators.postgres.namespace }} --no-headers 2>/dev/null | grep -i "postgresoperator" | awk '{print $NF}' | head -1 || echo "NotFound")
            if [ "$CSV_PHASE" = "Succeeded" ]; then
              echo "Crunchy PostgreSQL operator is ready"
              exit 0
            fi
            echo "Waiting for operator... (attempt $i/120, phase: $CSV_PHASE)"
            sleep 5
          done
          
          echo "ERROR: Crunchy PostgreSQL operator did not become ready within timeout"
          exit 1
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres-setup-sa
  namespace: {{ .Values.operators.postgres.namespace }}
  labels:
    {{- include "fusion-developer-hub.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: postgres-setup-role
  labels:
    {{- include "fusion-developer-hub.labels" . | nindent 4 }}
rules:
- apiGroups: ["operators.coreos.com"]
  resources: ["clusterserviceversions", "subscriptions"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: postgres-setup-binding
  labels:
    {{- include "fusion-developer-hub.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: postgres-setup-role
subjects:
- kind: ServiceAccount
  name: postgres-setup-sa
  namespace: {{ .Values.operators.postgres.namespace }}
{{- else }}
---
# ConfigMap to indicate PostgreSQL operator already exists
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-operator-exists
  namespace: {{ .Values.operators.postgres.namespace }}
  labels:
    {{- include "fusion-developer-hub.labels" . | nindent 4 }}
  annotations:
    {{- if not .Values.argocd.enabled }}
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    {{- end }}
    argocd.argoproj.io/sync-wave: "0"
data:
  message: "Crunchy PostgreSQL operator already exists in the cluster - skipping installation"
  subscription: "{{ .Values.operators.postgres.namespace }}/crunchy-postgres-operator"
{{- end }}
{{- end }}
{{- end }}

