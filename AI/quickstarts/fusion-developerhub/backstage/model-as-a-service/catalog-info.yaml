apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: model-as-a-service-quickstart
  title: "Quickstart: Model-as-a-Service on IBM Fusion"
  description: |
    The Model-as-a-Service (MaaS) Quickstart deploys a complete, GPU-accelerated LLM serving platform on IBM Fusion HCI. It provides a self-service model catalog, automated model lifecycle management, and a standardized OpenAI-compatible API — so any team can request a model endpoint without touching infrastructure.

    What gets deployed:
    - MaaS Platform — IBM Fusion MaaS operator + OpenShift AI (RHOAI) for GPU-scheduled LLM inference
    - Model Registry — Git-backed catalog of approved models (Granite, Qwen, LLaMA, custom) with automated reconciliation
    - Model Serving — vLLM-powered inference with OpenAI-compatible REST endpoints, GPU auto-provisioning, and health monitoring
    - Governance Layer — subscription-based model access control via MaaSAuthPolicy; per-namespace quotas and RBAC
    - Secret Management — HashiCorp Vault + External Secrets Operator for S3 credentials and model weights storage

    Why this quickstart:
    - Models served in minutes — deploy Granite 4.1 or Qwen3 to a GPU node with a single Helm command
    - GitOps-driven model lifecycle — add a YAML file to the model registry repo; ArgoCD handles the rest
    - OpenAI-compatible API — any application using the OpenAI SDK can point to the MaaS endpoint with zero code changes
    - IBM Fusion Object Storage integration — models pulled directly from Fusion S3-compatible storage; no external cloud required
    - Dual deployment paths — Helm for quick iteration, ArgoCD for production GitOps workflows

    Ideal for:
    - AI platform teams needing a shared, governed LLM serving layer for multiple squads
    - Application developers who want an API endpoint without managing GPU infrastructure
    - Organizations standardizing on IBM Granite or open-source models with enterprise governance
  tags:
