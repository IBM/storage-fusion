<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="-apple-system, Segoe UI, system-ui, sans-serif">
  <defs>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#57606a"></polygon>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="300" fill="#ffffff"></rect>

  <!-- Domain -->
  <rect x="20" y="20" width="150" height="46" rx="5" fill="#fff9e6" stroke="#9a6700" stroke-width="1.2"></rect>
  <text x="95" y="47" text-anchor="middle" font-size="12" font-weight="700" fill="#9a6700">Domain</text>
  <text x="95" y="60" text-anchor="middle" font-size="9" fill="#57606a">IBM Fusion AI Services</text>

  <!-- System -->
  <rect x="230" y="20" width="150" height="46" rx="5" fill="#f0faf0" stroke="#2da44e" stroke-width="1.2"></rect>
  <text x="305" y="42" text-anchor="middle" font-size="12" font-weight="700" fill="#2da44e">System</text>
  <text x="305" y="56" text-anchor="middle" font-size="9" fill="#57606a">fusion-&lt;cluster&gt;</text>

  <!-- Component CAS -->
  <rect x="440" y="8" width="160" height="46" rx="5" fill="#e8f0fb" stroke="#3b82d4" stroke-width="1.2"></rect>
  <text x="520" y="30" text-anchor="middle" font-size="12" font-weight="700" fill="#3b82d4">Component</text>
  <text x="520" y="44" text-anchor="middle" font-size="9" fill="#57606a">fusion-cas-&lt;cluster&gt;</text>

  <!-- Component DCS -->
  <rect x="440" y="76" width="160" height="46" rx="5" fill="#e8f0fb" stroke="#3b82d4" stroke-width="1.2"></rect>
  <text x="520" y="98" text-anchor="middle" font-size="12" font-weight="700" fill="#3b82d4">Component</text>
  <text x="520" y="112" text-anchor="middle" font-size="9" fill="#57606a">fusion-dcs-&lt;cluster&gt;</text>

  <!-- API CAS -->
  <rect x="640" y="8" width="150" height="46" rx="5" fill="#f7f8fa" stroke="#d0d7de" stroke-width="1.2"></rect>
  <text x="715" y="30" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2328">API</text>
  <text x="715" y="44" text-anchor="middle" font-size="9" fill="#57606a">fusion-cas-mcp-api</text>

  <!-- API DCS -->
  <rect x="640" y="76" width="150" height="46" rx="5" fill="#f7f8fa" stroke="#d0d7de" stroke-width="1.2"></rect>
  <text x="715" y="98" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2328">API</text>
  <text x="715" y="112" text-anchor="middle" font-size="9" fill="#57606a">fusion-dcs-mcp-api</text>

  <line x1="170" y1="43" x2="230" y2="43" stroke="#57606a" stroke-width="1.2" marker-end="url(#arr2)"></line>
  <line x1="380" y1="43" x2="440" y2="31" stroke="#57606a" stroke-width="1.2" marker-end="url(#arr2)"></line>
  <line x1="380" y1="43" x2="440" y2="99" stroke="#57606a" stroke-width="1.2" marker-end="url(#arr2)"></line>
  <line x1="600" y1="31" x2="640" y2="31" stroke="#57606a" stroke-width="1.2" marker-end="url(#arr2)"></line>
  <line x1="600" y1="99" x2="640" y2="99" stroke="#57606a" stroke-width="1.2" marker-end="url(#arr2)"></line>

  <text x="715" y="140" text-anchor="middle" font-size="9.5" fill="#57606a">Overview · Definition (live sandbox) · Docs (VS Code / watsonx snippets)</text>

  <!-- Endpoint derivation -->
  <rect x="20" y="170" width="860" height="112" rx="8" fill="#f7f8fa" stroke="#d0d7de" stroke-width="1.2"></rect>
  <text x="450" y="192" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2328">One OCP API URL → seven auto-derived endpoints</text>

  <rect x="60" y="206" width="250" height="34" rx="5" fill="#fff" stroke="#3b82d4" stroke-width="1.2"></rect>
  <text x="185" y="228" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#1f2328">https://api.&lt;domain&gt;:6443</text>

  <line x1="310" y1="223" x2="360" y2="223" stroke="#3b82d4" stroke-width="1.4" marker-end="url(#arr2)"></line>

  <rect x="370" y="200" width="210" height="46" rx="5" fill="#e8f5e9" stroke="#2da44e" stroke-width="1.2"></rect>
  <text x="475" y="216" text-anchor="middle" font-size="10" font-weight="700" fill="#2da44e">CAS (4 endpoints)</text>
  <text x="475" y="230" text-anchor="middle" font-size="8.5" fill="#57606a">mcp · mcp-streamable · docs · health</text>
  <text x="475" y="241" text-anchor="middle" font-size="8.5" fill="#57606a">+ console route</text>

  <rect x="600" y="200" width="220" height="46" rx="5" fill="#ede9ff" stroke="#7c5cd8" stroke-width="1.2"></rect>
  <text x="710" y="216" text-anchor="middle" font-size="10" font-weight="700" fill="#7c5cd8">DCS (3 endpoints)</text>
  <text x="710" y="230" text-anchor="middle" font-size="8.5" fill="#57606a">mcp/http · mcp (SSE)</text>
  <text x="710" y="241" text-anchor="middle" font-size="8.5" fill="#57606a">+ console route</text>

  <text x="450" y="266" text-anchor="middle" font-size="9.5" fill="#57606a">No manual URL wrangling. No route hunting. One field, seven endpoints, zero mistakes.</text>
</svg>
