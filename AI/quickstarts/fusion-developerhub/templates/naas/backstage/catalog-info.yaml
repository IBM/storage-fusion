      title: Read the IBM Tech Exchange Blog
      icon: article
    - url: https://ibm.github.io/storage-fusion/fusion-ai/resources/
      title: Explore on Fusion Tech Community
      icon: web
spec:
  type: quickstart
  lifecycle: production
  owner: group:default/fusion-platform-team
  system: fusion-ai-services
  dependsOn:
