      action: publish:github:pull-request
      input:
        token: ${{ secrets.USER_OAUTH_TOKEN }}
        repoUrl: ${{ (parameters.githubHost if parameters.githubHost else "github.com") + "?repo=" + parameters.repoName + "&owner=" + parameters.repoOrg }}
        title: 'NaaS: update ${{ parameters.projectName }}-${{ parameters.environment }}'
        description: |
          Namespace update request from Fusion Developer Hub.

          | Field | Value |
          |---|---|
          | Project | `${{ parameters.projectName }}` |
          | Environment | `${{ parameters.environment }}` |
          | Business Unit | `${{ parameters.businessUnit }}` |
          | Size | `${{ parameters.size }}` |
          | Owner Group | `${{ parameters.ownerGroup }}` |
          | Developer Group | `${{ parameters.developerGroup or '-' }}` |
          | Viewer Group | `${{ parameters.viewerGroup or '-' }}` |

          **Merge this PR** to trigger ArgoCD sync and apply the namespace changes.
        branchName: naas-update-${{ parameters.projectName }}-${{ parameters.environment }}
        targetBranchName: ${{ parameters.targetBranch }}
        reviewers: ${{ parameters.prReviewers.split(",") | reject("equalto", "") | list if parameters.prReviewers else [] }}

    - id: tag-pr-metadata
      name: Tag Pull Request Metadata Labels
      action: github:issues:label
      input:
        token: ${{ secrets.USER_OAUTH_TOKEN }}
        repoUrl: ${{ (parameters.githubHost if parameters.githubHost else "github.com") + "?repo=" + parameters.repoName + "&owner=" + parameters.repoOrg }}
        number: ${{ steps['publish-gitops'].output.pullRequestNumber }}
        labels:
          - 'Project Name: ${{ parameters.projectName }}'
          - 'Environment: ${{ parameters.environment }}'
          - 'Business Unit: ${{ parameters.businessUnit }}'
          - 'Size: ${{ parameters.size }}'
          - 'NaaS - Update'

  # ──────────────────────────────────────────────
  # 3. Output links shown to the requester
  # ──────────────────────────────────────────────
  output:
    links:
      - title: View Pull Request
        url: ${{ steps['publish-gitops'].output.remoteUrl }}
        icon: github

---
# ══════════════════════════════════════════════════════════════════════════════
# Template 3 of 3 — DELETE an existing namespace
# ══════════════════════════════════════════════════════════════════════════════
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: openshift-naas-delete-template
  title: Delete OpenShift Namespace (NaaS)
  description: >
    Raise a GitOps PR to remove an existing OpenShift namespace and all its
    managed manifests. ArgoCD will deprovision the namespace on merge.
  tags:
    - openshift
    - naas
    - platform-engineering
spec:
  owner: platform-team
  type: service

  # ──────────────────────────────────────────────
  # 1. Parameters
  # ──────────────────────────────────────────────
  parameters:

    # ── Step 1: Identify the namespace to delete ──────────────────────────────
    - title: Namespace to Delete
      required:
        - projectName
        - environment
        - confirmDelete
      properties:
        # ── Platform settings (hidden)
        # Set these defaults to match your deployment before registering this template.
        githubHost:
          type: string
          ui:widget: hidden
          ui:backstage:
            review:
              show: false
          default: 'github.ibm.com'
        repoOrg:
          type: string
          ui:widget: hidden
          ui:backstage:
            review:
              show: false
          default: 'ProjectAbell'
        repoName:
          type: string
          ui:widget: hidden
          ui:backstage:
            review:
              show: false
          default: 'Fusion-AI'
        targetBranch:
          type: string
          ui:widget: hidden
          ui:backstage:
            review:
              show: false
          default: 'rhdh-namespace-as-a-service'
        prReviewers:
          type: string
          ui:widget: hidden
          ui:backstage:
            review:
              show: false
          default: 'Purnanand-Kumar1'
        namespacesPath:
          type: string
          ui:widget: hidden
          ui:backstage:
            review:
              show: false
          default: 'namespaces'
        # ── Visible fields
        projectName:
          title: Project Name
          type: string
          description: >
            Name of the namespace to delete (lowercase, alphanumeric, hyphens only).
            The namespace is identified as `{Project Name}-{Environment}`.
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
          ui:autofocus: true
        environment:
          title: Environment
          type: string
          description: Environment tier of the namespace to delete.
          enum:
            - development
            - staging
            - production
          enumNames:
            - Development
            - Staging
            - Production
        confirmDelete:
          title: Confirm Deletion
          type: string
          description: >
            Type the namespace name exactly as it will appear
            (`{projectName}-{environment}`) to confirm you intend to delete it.

  # ──────────────────────────────────────────────
  # 2. Actions triggered on form submit
  # ──────────────────────────────────────────────
  steps:
    - id: publish-gitops
      name: Publish Deletion to GitOps Repository
      action: publish:github:pull-request
      input:
        token: ${{ secrets.USER_OAUTH_TOKEN }}
        repoUrl: ${{ (parameters.githubHost if parameters.githubHost else "github.com") + "?repo=" + parameters.repoName + "&owner=" + parameters.repoOrg }}
        title: 'NaaS: delete ${{ parameters.projectName }}-${{ parameters.environment }}'
        description: |
          Namespace deletion request from Fusion Developer Hub.

          | Field | Value |
          |---|---|
          | Project | `${{ parameters.projectName }}` |
          | Environment | `${{ parameters.environment }}` |
          | Namespace | `${{ parameters.projectName }}-${{ parameters.environment }}` |

          ⚠️ **Merging this PR will permanently remove the namespace manifests.**
          ArgoCD will deprovision the namespace and all resources within it.
        branchName: naas-delete-${{ parameters.projectName }}-${{ parameters.environment }}
        targetBranchName: ${{ parameters.targetBranch }}
        reviewers: ${{ parameters.prReviewers.split(",") | reject("equalto", "") | list if parameters.prReviewers else [] }}
        filesToDelete:
          - ${{ parameters.namespacesPath }}/${{ parameters.projectName }}-${{ parameters.environment }}/catalog-info.yaml
          - ${{ parameters.namespacesPath }}/${{ parameters.projectName }}-${{ parameters.environment }}/limit-range.yaml
          - ${{ parameters.namespacesPath }}/${{ parameters.projectName }}-${{ parameters.environment }}/namespace.yaml
          - ${{ parameters.namespacesPath }}/${{ parameters.projectName }}-${{ parameters.environment }}/network-policy.yaml
          - ${{ parameters.namespacesPath }}/${{ parameters.projectName }}-${{ parameters.environment }}/rbac-role.yaml
          - ${{ parameters.namespacesPath }}/${{ parameters.projectName }}-${{ parameters.environment }}/resource-quota.yaml

    - id: tag-pr-metadata
      name: Tag Pull Request Metadata Labels
      action: github:issues:label
      input:
        token: ${{ secrets.USER_OAUTH_TOKEN }}
        repoUrl: ${{ (parameters.githubHost if parameters.githubHost else "github.com") + "?repo=" + parameters.repoName + "&owner=" + parameters.repoOrg }}
        number: ${{ steps['publish-gitops'].output.pullRequestNumber }}
        labels:
          - 'Project Name: ${{ parameters.projectName }}'
          - 'Environment: ${{ parameters.environment }}'
          - 'NaaS - Delete'

  # ──────────────────────────────────────────────
  # 3. Output links shown to the requester
  # ──────────────────────────────────────────────
  output:
    links:
      - title: View Pull Request
        url: ${{ steps['publish-gitops'].output.remoteUrl }}
        icon: github