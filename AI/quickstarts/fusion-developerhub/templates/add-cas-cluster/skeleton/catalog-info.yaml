apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: fusion-cas-${{ values.clusterName }}
  title: "IBM Fusion CAS — ${{ values.clusterName }}"
  description: "IBM Fusion Content Aware Storage on ${{ values.clusterName }}. Vector storage, MCP Server."
  tags:
    - fusion
    - cas
    - content-aware-storage
    - mcp
    - vector-storage
    - ai
    - ibm-fusion
    - ${{ values.clusterName }}
  annotations:
    fusion.ibm.com/cluster-id: "${{ values.clusterName }}"
    fusion.ibm.com/service-type: cas
    fusion.ibm.com/service-version: "${{ values.serviceVersion }}"
    fusion.ibm.com/ocp-api-url: "${{ values.ocpApiUrl }}"
    fusion.ibm.com/ocp-console-url: "https://console-openshift-console.apps.${{ values.domain }}"
    fusion.ibm.com/console-url: "https://console-ibm-spectrum-fusion-ns.apps.${{ values.domain }}"
    fusion.ibm.com/swagger-url: "https://console-ibm-spectrum-fusion-ns.apps.${{ values.domain }}/cas/api/v1/docs"
    fusion.ibm.com/mcp-endpoint: "https://console-ibm-spectrum-fusion-ns.apps.${{ values.domain }}/cas/api/v1/mcp"
    fusion.ibm.com/mcp-streamable-endpoint: "https://console-ibm-spectrum-fusion-ns.apps.${{ values.domain }}/cas/api/v1/mcp-streamable/"
    fusion.ibm.com/health-endpoint: "https://console-ibm-spectrum-fusion-ns.apps.${{ values.domain }}/cas/api/v1/health"
    backstage.io/techdocs-ref: "url:https://github.com/IBM/storage-fusion/tree/main/quickstarts/fusion-developerhub/fusion-ai-discovery/techdocs/cas"
  links:
    - url: "https://console-ibm-spectrum-fusion-ns.apps.${{ values.domain }}/cas/overview"
      title: "CAS Console"
      icon: dashboard
    - url: "https://console-ibm-spectrum-fusion-ns.apps.${{ values.domain }}/cas/api/v1/mcp-streamable/"
      title: "CAS MCP — Streamable (SSE)"
      icon: cloud
    - url: "https://console-ibm-spectrum-fusion-ns.apps.${{ values.domain }}/cas/api/v1/mcp"
      title: "CAS MCP — Standard (JSON-RPC 2.0)"
      icon: cloud
    - url: "https://console-ibm-spectrum-fusion-ns.apps.${{ values.domain }}/cas/api/v1/docs"
      title: "CAS Swagger UI"
      icon: code
    - url: "https://console-ibm-spectrum-fusion-ns.apps.${{ values.domain }}/cas/api/v1/health"
      title: "CAS Health Check"
      icon: heart
    - url: "https://console-openshift-console.apps.${{ values.domain }}"
      title: "OCP Console"
      icon: web
    - url: "https://www.ibm.com/docs/en/fusion-software/2.13.0?topic=services-content-aware-storage-cas"
      title: "IBM Docs — CAS Overview"
      icon: article
    - url: "https://www.ibm.com/docs/en/fusion-software/2.13.0?topic=cas-integrating-model-context-protocol-mcp"
      title: "IBM Docs — CAS MCP Integration"
      icon: article
    - url: "https://www.ibm.com/docs/en/fusion-software/2.13.0?topic=cas-integrating-watsonx-orchestrate-by-using-mcp"
      title: "IBM Docs — CAS + watsonx Orchestrate via MCP"
      icon: article
    - url: "https://community.ibm.com/community/user/blogs/namita-singroha/2026/03/24/bob-meets-ibm-cas-mcp"
      title: "Blog — Bob meets IBM CAS MCP (IBM Community)"
      icon: chat
    - url: "https://medium.com/@singrohanamita/ibm-bob-meets-cas-mcp-everything-you-need-to-get-started-95d7e01b7f20"
      title: "Blog — IBM Bob meets CAS MCP: Get Started (Medium)"
      icon: chat
spec:
  type: fusion-service
  lifecycle: production
  owner: group:default/fusion-team
  system: fusion-ai-services
