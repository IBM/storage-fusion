    fusion.ibm.com/mcp-streamable-endpoint: "https://console-ibm-spectrum-fusion-ns.apps.${{ values.domain }}/cas/api/v1/mcp-streamable/"
    fusion.ibm.com/swagger-url: "https://console-ibm-spectrum-fusion-ns.apps.${{ values.domain }}/cas/api/v1/docs"
