# =============================================================================
# catalog-info.yaml — IBM Fusion Cluster: ${{ values.clusterName }}
#
# Generated by RHDH Software Template  "Add IBM Fusion Cluster (CAS + DCS)"
# Do NOT edit manually — re-run the template to update versions or settings.
#
# Cluster : ${{ values.clusterName }}
# OCP API : ${{ values.ocpApiUrl }}
# Domain  : ${{ values.domain }}
# Type    : ${{ values.clusterType }}
# =============================================================================

# ── System ────────────────────────────────────────────────────────────────────
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: fusion-${{ values.clusterName }}
  title: "IBM Fusion HCI — ${{ values.clusterName }}"
  description: >
    IBM Fusion HCI on ${{ values.clusterName }} (${{ values.clusterType }}).
    {%- if values.dcsEnabled %}  DCS {{ values.dcsVersion or "n/a" }}.{% endif %}
    {%- if values.casEnabled %}  CAS {{ values.casVersion or "n/a" }}.{% endif %}
  tags:
    - fusion
    - openshift
    - ${{ values.clusterName }}
    {%- if values.dcsEnabled %}
    - dcs
    {%- endif %}
    {%- if values.casEnabled %}
    - cas
    {%- endif %}
    - ${{ values.clusterType }}
  annotations:
    fusion.ibm.com/cluster-id: "${{ values.clusterName }}"
    fusion.ibm.com/cluster-type: "${{ values.clusterType }}"
    backstage.io/source-location: "dir:."
  links:
    - url: https://console-ibm-spectrum-fusion-ns.apps.${{ values.domain }}
      title: Fusion HCI Console
      icon: dashboard
    - url: https://console-openshift-console.apps.${{ values.domain }}
      title: OCP Console
      icon: web
spec:
  owner: group:default/fusion-team
  domain: fusion-ai-services

{%- if values.dcsEnabled %}
---
# ── DCS Component ─────────────────────────────────────────────────────────────
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: fusion-dcs-${{ values.clusterName }}
  title: "IBM Fusion DCS — ${{ values.clusterName }}"
  description: >
    IBM Fusion Data Cataloging Service (DCS) on ${{ values.clusterName }}
    {%- if values.dcsVersion %} (v{{ values.dcsVersion }}){% endif %}.
    DCS — powered by IBM Spectrum Discover — delivers automated metadata scanning,
    AI-powered classification, and policy-driven data lifecycle management.
    Exposes an MCP Server for natural language catalog queries.
  tags:
    - fusion
    - dcs
    - ${{ values.clusterName }}
    - data-cataloging
    - mcp
    - ai
    - ${{ values.clusterType }}
  annotations:
    fusion.ibm.com/cluster-id: "${{ values.clusterName }}"
    fusion.ibm.com/cluster-type: "${{ values.clusterType }}"
    fusion.ibm.com/service-type: "dcs"
    fusion.ibm.com/service-namespace: "ibm-data-cataloging"
    fusion.ibm.com/service-version: "${{ values.dcsVersion }}"
    fusion.ibm.com/console-url: "https://console-ibm-data-cataloging.apps.${{ values.domain }}"
    fusion.ibm.com/mcp-endpoint: "https://dcs-mcp-route-ibm-data-cataloging.apps.${{ values.domain }}/mcp/http"
    fusion.ibm.com/mcp-sse-endpoint: "https://dcs-mcp-route-ibm-data-cataloging.apps.${{ values.domain }}/mcp"
    fusion.ibm.com/mcp-proxy: "/api/proxy/fusion-${{ values.clusterName }}-dcs-mcp/mcp/http"
    fusion.ibm.com/mcp-sse-proxy: "/api/proxy/fusion-${{ values.clusterName }}-dcs-mcp/mcp"
    fusion.ibm.com/console-proxy: "/api/proxy/fusion-${{ values.clusterName }}-dcs"
    fusion.ibm.com/mcp-available: "true"
    fusion.ibm.com/catalog-visible: "true"
    backstage.io/techdocs-ref: "url:https://github.com/IBM/storage-fusion/tree/main/quickstarts/fusion-developerhub/fusion-ai-discovery/techdocs/dcs"
    backstage.io/source-location: "dir:."
  links:
    - url: https://console-ibm-data-cataloging.apps.${{ values.domain }}
      title: "DCS Console"
      icon: dashboard
    - url: https://dcs-mcp-route-ibm-data-cataloging.apps.${{ values.domain }}/mcp/http
      title: "DCS MCP — HTTP Endpoint (POST, JSON-RPC 2.0)"
      icon: cloud
    - url: https://dcs-mcp-route-ibm-data-cataloging.apps.${{ values.domain }}/mcp
      title: "DCS MCP — SSE Endpoint (streaming)"
      icon: cloud
    - url: https://www.ibm.com/docs/en/fusion-software/2.13.0?topic=services-data-cataloging
      title: "IBM Docs — Data Cataloging Service"
      icon: article
    - url: https://www.ibm.com/docs/en/fusion-software/2.13.0?topic=capabilities-data-cataloging-mcp-server
      title: "IBM Docs — DCS MCP Server"
      icon: article
spec:
  type: fusion-service
  lifecycle: production
  owner: group:default/fusion-team
  system: fusion-${{ values.clusterName }}
  providesApis:
    - fusion-dcs-mcp-api-${{ values.clusterName }}

---
# ── DCS MCP API ───────────────────────────────────────────────────────────────
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: fusion-dcs-mcp-api-${{ values.clusterName }}
  title: "IBM Fusion DCS MCP Server — ${{ values.clusterName }}"
  description: >
    DCS MCP Server on ${{ values.clusterName }}
    {%- if values.dcsVersion %} (v{{ values.dcsVersion }}){% endif %}.
    Exposes metadata catalog tools via JSON-RPC 2.0 over HTTP and SSE streaming.
    Connect Bob, VS Code, or watsonx Orchestrate via the proxy or direct endpoint.
  tags:
    - fusion
    - dcs
    - mcp
    - ${{ values.clusterName }}
    - ai
    - watsonx
  annotations:
    fusion.ibm.com/cluster-id: "${{ values.clusterName }}"
    fusion.ibm.com/service-type: "dcs"
    fusion.ibm.com/service-version: "${{ values.dcsVersion }}"
    fusion.ibm.com/mcp-endpoint: "https://dcs-mcp-route-ibm-data-cataloging.apps.${{ values.domain }}/mcp/http"
    fusion.ibm.com/mcp-proxy: "/api/proxy/fusion-${{ values.clusterName }}-dcs-mcp/mcp/http"
    backstage.io/source-location: "dir:."
  links:
    - url: https://dcs-mcp-route-ibm-data-cataloging.apps.${{ values.domain }}/mcp/http
      title: "DCS MCP — HTTP transport (POST)"
      icon: cloud
    - url: https://dcs-mcp-route-ibm-data-cataloging.apps.${{ values.domain }}/mcp
      title: "DCS MCP — SSE transport"
      icon: cloud
    - url: https://www.ibm.com/docs/en/fusion-software/2.13.0?topic=capabilities-data-cataloging-mcp-server
      title: "IBM Docs — DCS MCP Server"
      icon: article
spec:
  type: openapi
  lifecycle: production
  owner: group:default/fusion-team
  system: fusion-${{ values.clusterName }}
  definition: |
    openapi: "3.0.0"
    info:
      title: IBM Fusion DCS MCP Server (${{ values.clusterName }})
      version: "${{ values.dcsVersion or "0.0.0" }}"
      description: MCP server for the DCS data catalog on ${{ values.clusterName }}.
    servers:
      - url: /api/proxy/fusion-${{ values.clusterName }}-dcs-mcp
        description: Via RHDH Proxy (no cluster access needed)
      - url: https://dcs-mcp-route-ibm-data-cataloging.apps.${{ values.domain }}
        description: Direct (${{ values.clusterType }})
    paths:
      /mcp/http:
        post:
          summary: DCS MCP — HTTP Endpoint (JSON-RPC 2.0)
          tags: [MCP-HTTP]
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  type: object
                  required: [jsonrpc, id, method]
                  properties:
                    jsonrpc: {type: string, enum: ["2.0"]}
                    id: {type: integer}
                    method: {type: string, enum: [initialize, "tools/list", "tools/call"]}
                    params: {type: object}
          responses:
            "200": {description: JSON-RPC 2.0 response}
      /mcp:
        get:
          summary: DCS MCP — SSE Endpoint (streaming)
          tags: [MCP-SSE]
          responses:
            "200": {description: SSE event stream}
{%- endif %}

