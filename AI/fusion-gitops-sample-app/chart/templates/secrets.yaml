{{- if .Values.secrets.externalSecret.enabled }}
---
# Option A: ExternalSecret — pulls keys from HashiCorp Vault (production)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: llmops-secrets
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "llmops.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.syncWaves.secrets | quote }}
spec:
  refreshInterval: {{ .Values.secrets.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.secrets.externalSecret.secretStoreName }}
    kind: {{ .Values.secrets.externalSecret.secretStoreKind }}
  target:
    name: llmops-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        cas_api_key:           "{{ `{{ .cas_api_key }}` }}"
        model_gateway_api_key: "{{ `{{ .model_gateway_api_key }}` }}"
  dataFrom:
    - extract:
        key: {{ .Values.secrets.externalSecret.vaultPath }}
{{- end }}

{{- if .Values.secrets.hardcoded.enabled }}
---
# Option B: Hardcoded Secret — development / CI only
apiVersion: v1
kind: Secret
metadata:
  name: llmops-secrets
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "llmops.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.syncWaves.secrets | quote }}
type: Opaque
stringData:
  cas_api_key:           {{ .Values.secrets.hardcoded.casApiKey | quote }}
  model_gateway_api_key: {{ .Values.secrets.hardcoded.modelGatewayApiKey | quote }}
{{- end }}
