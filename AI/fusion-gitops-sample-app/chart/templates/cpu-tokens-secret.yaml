{{/*
CPU Token Secret — brings the three KServe bearer tokens into llmops-platform
so the pod's env vars can reference them with a local secretKeyRef.

secretKeyRef cannot cross namespaces: the tokens originate in
deploy-models-cpu but the pod runs in llmops-platform.
This secret (llmops-cpu-tokens) lives in llmops-platform and is the
single source the deployment reads MODEL_TOKEN_* from.

Choose ONE of the two options (mirrors the top-level secrets block):
  cpu.tokens.externalSecret.enabled: true   → ESO pulls from Vault (same path as llmops-secrets)
  cpu.tokens.hardcoded.enabled: true        → raw token strings in values.yaml (dev/test)
*/}}

{{- if .Values.cpu.tokens.externalSecret.enabled }}
---
# Option A: ExternalSecret — ESO extracts all keys from the Vault path.
# The three CPU tokens were added to the same llmops-platform/secrets Vault
# path as cas_api_key and model_gateway_api_key.
# Vault keys:
#   external-access-token-qwen2-5-1-5b-cpu-sa      → token_chat
#   external-access-token-qwen2-5-coder-1-5b-cpu-sa → token_code
#   external-access-token-smollm2-1-7b-cpu-sa       → token_summarize
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: llmops-cpu-tokens
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "llmops.labels" . | nindent 4 }}
    app.kubernetes.io/component: cpu-tokens
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.syncWaves.secrets | quote }}
spec:
  refreshInterval: {{ .Values.cpu.tokens.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.cpu.tokens.externalSecret.secretStoreName }}
    kind: {{ .Values.cpu.tokens.externalSecret.secretStoreKind }}
  target:
    name: llmops-cpu-tokens
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        # Vault keys contain hyphens so must be referenced with the index function
        # in the ESO go-template engine: {{ index . "key-with-hyphens" }}
        token_chat:      '{{ `{{ index . "` }}{{ .Values.cpu.tokens.externalSecret.chatTokenSecret }}{{ `" }}` }}'
        token_code:      '{{ `{{ index . "` }}{{ .Values.cpu.tokens.externalSecret.codeTokenSecret }}{{ `" }}` }}'
        token_summarize: '{{ `{{ index . "` }}{{ .Values.cpu.tokens.externalSecret.summarizeTokenSecret }}{{ `" }}` }}'
  dataFrom:
    - extract:
        key: {{ .Values.cpu.tokens.externalSecret.vaultPath }}
{{- end }}

{{- if .Values.cpu.tokens.hardcoded.enabled }}
---
# Option B: Hardcoded Secret — dev / testing only.
# Obtain token values with:
#   oc get secret external-access-token-<model>-sa \
#     -n deploy-models-cpu -o jsonpath='{.data.token}' | base64 -d
apiVersion: v1
kind: Secret
metadata:
  name: llmops-cpu-tokens
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "llmops.labels" . | nindent 4 }}
    app.kubernetes.io/component: cpu-tokens
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.syncWaves.secrets | quote }}
type: Opaque
stringData:
  token_chat:      {{ .Values.cpu.tokens.hardcoded.chatToken | quote }}
  token_code:      {{ .Values.cpu.tokens.hardcoded.codeToken | quote }}
  token_summarize: {{ .Values.cpu.tokens.hardcoded.summarizeToken | quote }}
{{- end }}
